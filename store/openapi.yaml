          schema:
            type: string
          description: Agent UUID
      responses:
        "200":
          description: Agent deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not your agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents/{id}/clone:
    post:
      summary: Clone agent
      description: Fork a published agent as a new draft. Copies state, personality, and knowledge base. Requires `creator` role.
      operationId: cloneAgent
      tags: [Agents]
      parameters:
        - name: id
          in: path
