      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── GitHub App ────────────────────────────────────────────────────────────

  /v1/github/status:
    get:
      summary: Is the GitHub App configured?
      description: The whole GitHub App feature is inert until the deployment sets its app id and private key. Unauthenticated — it reveals only whether the feature exists here.
      operationId: githubAppStatus
      security: []
      tags: [Connectors]
      responses:
        "200":
          description: Configuration state
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: { type: boolean }

  /v1/github/install-url:
    get:
      summary: URL to install the GitHub App
      operationId: githubInstallUrl
      tags: [Connectors]
      parameters:
        - { name: repoId, in: query, description: Carried through the install `state` so the caller can resume where it left off., schema: { type: string } }
      responses:
        "200":
          description: The install URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  installUrl: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/github/installations:
    get:
      summary: My verified App installations
      description: |
        Only the installations this user has a VERIFIED binding to — never the App's global
        installation list. Enumerating that list was the reconnaissance step of a cross-tenant
        IDOR, so it is not exposed.
      operationId: listGithubInstallations
      tags: [Connectors]
      responses:
        "200":
          description: Installations
          content:
            application/json:
              schema:
                type: object
                properties:
                  installations:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/github/installations/{installationId}/repos:
    get:
      summary: Repositories an installation can access
      operationId: listInstallationRepos
      tags: [Connectors]
      parameters:
        - { name: installationId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos:
                    type: array
                    items:
                      type: object
                      properties:
                        fullName: { type: string }
                        name: { type: string }
                        cloneUrl: { type: string, format: uri }
                        defaultBranch: { type: string }
                        private: { type: boolean }
                        description: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: This installation is not bound to your account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/github/callback:
    get:
      summary: GitHub App install callback
      description: |
        Records the installation and caches its token. Requires a Bearer session: the
        `installation_id` query parameter is attacker-controlled, so control of the
        installation's account is PROVEN before binding — personal accounts by login match,
        organisations by active membership. This is the only path that creates an installation
        binding.
      operationId: githubInstallCallback
      tags: [Connectors]
      parameters:
        - { name: installation_id, in: query, required: true, schema: { type: integer } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "200":
          description: Bound
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  installationId: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Could not verify that you control this installation's account
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                  installationId: { type: integer }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ── Generic connector OAuth ───────────────────────────────────────────────

  /v1/connectors:
    get:
      summary: The connector catalog, resolved for the caller
      description: |
        Every connector the platform declares, with what it IS (auth model, scopes, grant model,
        unattended class, its tools) and where the caller stands with it (`configured` — does
        this deployment have credentials at all; `connected` — has the caller connected it, or
        `null` for a connector that holds no credential).

        Added because the registry has been the single source of truth for connectors since #86
        but only from inside the Worker, so every consumer that needed "which connectors exist
        and is this one connected" kept its own list — two route files, three hand-written
        console blocks, an MCP provider map with a matching enum, and the folder-sync trigger
        branch. This is the one answer they derive from.
      operationId: listConnectors
      tags: [Connectors]
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: google_drive }
                        label: { type: string, example: Google Drive }
                        auth: { type: string, enum: [oauth, token, app, none] }
                        scopes:
                          type: object
                          properties:
                            read: { type: boolean }
                            write: { type: boolean }
                        grantModel: { type: string, enum: [user, instance-resource] }
                        unattended: { type: string, enum: [yes, refresh, interactive-only] }
                        tools: { type: array, items: { type: string } }
                        configured: { type: boolean, description: Whether this deployment can offer the connector at all. }
                        connected: { type: boolean, nullable: true, description: "Whether the caller has connected it; null when the connector holds no credential (relay/no-auth)." }
                        account: { type: string, nullable: true }
                        connectedAt: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/connectors/{id}/oauth/start:
    get:
      summary: Begin a connector's OAuth flow
      description: |
        One authorize/callback pair for every OAuth connector, driven by the connector's own
        manifest rather than bespoke per-provider routes. Returns the provider's authorize URL
        and sets an `HttpOnly` bind cookie: a signed state is otherwise bearer-grade, so an
        attacker's link completed by a victim would store the VICTIM's refresh token under the
        ATTACKER's account.
      operationId: connectorOauthStart
      tags: [Connectors]
      parameters:
        - { name: id, in: path, required: true, description: Connector id from the registry., schema: { type: string } }
      responses:
        "200":
          description: The provider's authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No OAuth connector with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/connectors/{id}/oauth/callback:
    get:
      summary: Connector OAuth callback
      description: |
        Exchanges the code and stores ONLY the refresh token, envelope-encrypted in the key
        vault under the connector's id. The state must match the single-use bind cookie, which
        is cleared whatever the outcome. A provider that returns no refresh token is rejected
        with an actionable message rather than a half-connected state. Responds with HTML.
      operationId: connectorOauthCallback
      security: []
      tags: [Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Connected — a small HTML confirmation page
          content:
            text/html:
              schema: { type: string }
        "400": { description: "Missing code/state, failed bind check, token exchange failure, or no refresh token returned" }
        "404": { description: No OAuth connector with that id }
        "500": { description: Key encryption is not configured on this deployment }
        "503": { description: The connector's OAuth credentials are not configured on this deployment }

  /v1/connectors/{id}/oauth/status:
    get:
      summary: Is this connector connected?
      operationId: connectorOauthStatus
      tags: [Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Connection state
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  account: { type: string, nullable: true }
                  connectedAt: { type: string, nullable: true }
                  configured: { type: boolean, description: Whether this deployment has the connector's OAuth credentials at all. }
                  reach:
                    allOf: [{ $ref: "#/components/schemas/ConnectorReach" }]
                    description: Present only for `grantModel: instance-resource` — what a disconnect would revoke.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No OAuth connector with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/connectors/{id}/oauth:
    delete:
      summary: Disconnect a connector
      description: >
        Drops the stored refresh token, and — for a `grantModel: instance-resource` connector —
        every per-instance grant the caller made for it, reported as `revoked`. Without the
        cascade this route would be a second disconnect path that leaves grants standing for the
        next reconnect to restore.
      operationId: connectorOauthDisconnect
      tags: [Connectors]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { $ref: "#/components/schemas/ConnectorReach" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Gmail ─────────────────────────────────────────────────────────────────

  /v1/email/google/start:
    get:
      summary: Begin the Gmail connection
      description: |
        Read-only Gmail access, so a permissioned agent can look up a confirmation or
        verification link. Only the refresh token is persisted (encrypted, vault provider
        `gmail`); access tokens are minted on demand and never stored. The refresh token is
        also never revealable — not through the key vault, not over MCP.
      operationId: gmailStart
      tags: [Connectors]
      responses:
        "200":
          description: The Google consent URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/email/google/callback:
    get:
      summary: Gmail OAuth callback
      operationId: gmailCallback
      security: []
      tags: [Connectors]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Connected — a small HTML confirmation page
          content:
            text/html:
              schema: { type: string }
        "400": { description: "Missing code/state, failed bind check, or Google returned no refresh token" }
        "500": { description: Key encryption is not configured }
        "503": { description: Gmail connection is not configured on this deployment }

  /v1/email/status:
    get:
      summary: Gmail connection status
      description: Also backfills and returns which account is connected, which incidentally verifies the stored token still works.
      operationId: gmailStatus
      tags: [Connectors]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  email: { type: string, nullable: true }
                  connectedAt: { type: string, nullable: true }
                  configured: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/email/google:
    delete:
      summary: Disconnect Gmail
      operationId: gmailDisconnect
      tags: [Connectors]
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Google Drive ──────────────────────────────────────────────────────────

  /v1/drive/google/start:
    get:
      summary: Begin the Google Drive connection
      description: Read-only OAuth; only the refresh token is persisted, encrypted under vault provider `google_drive`.
      operationId: driveStart
      tags: [Connectors]
      responses:
        "200":
          description: The Google consent URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/drive/google/callback:
    get:
      summary: Google Drive OAuth callback
      operationId: driveCallback
      security: []
      tags: [Connectors]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Connected — a small HTML confirmation page
          content:
            text/html:
              schema: { type: string }
        "400": { description: "Missing code/state, failed bind check, or no refresh token returned" }
        "500": { description: Key encryption is not configured }
        "503": { description: Google Drive connection is not configured on this deployment }

  /v1/drive/status:
    get:
      summary: Google Drive connection status
      operationId: driveStatus
      tags: [Connectors]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  email: { type: string, nullable: true }
                  connectedAt: { type: string, nullable: true }
                  configured: { type: boolean }
                  reach: { $ref: "#/components/schemas/ConnectorReach" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/drive/google:
    delete:
      summary: Disconnect Google Drive
      description: >
        Revokes the account's Drive connection AND every per-instance folder grant it made,
        on every agent. Grants used to survive a disconnect and be silently restored by the
        next reconnect; `reach` on `/v1/drive/status` is the same count, available beforehand
        so a confirmation can state it.
      operationId: driveDisconnect
      tags: [Connectors]
      responses:
        "200":
          description: Disconnected; `revoked` is what was destroyed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  revoked: { $ref: "#/components/schemas/ConnectorReach" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/drive/files:
    get:
      summary: Search my Drive
      description: Account-level browse, used to find the folder you want to grant. This is NOT what an agent reads — an agent only ever sees what a grant covers.
      operationId: listDriveFiles
      tags: [Connectors]
      parameters:
        - { name: q, in: query, description: Drive search query., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { type: object, additionalProperties: true }
        "400":
          description: Google Drive is not connected for this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/drive/instances/{instanceId}/grants:
    get:
      summary: Drive folders granted to this instance
      description: The per-instance access boundary — an agent can only read inside a folder you explicitly granted it.
      operationId: listDriveGrants
      tags: [Connectors]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Grant this instance a Drive folder
      description: Folders only — file-level grants are not supported. The reference is resolved against Drive and rejected if it is not a folder.
      operationId: createDriveGrant
      tags: [Connectors]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resourceId: { type: string, description: A Drive folder id. Either this or `url` is required. }
                url: { type: string, format: uri }
                name: { type: string, description: Display label; defaults to the folder's Drive name. }
      responses:
        "201":
          description: The grant
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/drive/instances/{instanceId}/grants/{grantId}:
    delete:
      summary: Revoke a Drive folder grant
      operationId: deleteDriveGrant
      tags: [Connectors]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: grantId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/drive/instances/{instanceId}/files:
    get:
      summary: Browse inside a granted folder
      description: The requested folder must DESCEND from the grant's folder; anything else is 403. That containment check is what makes the grant a real boundary rather than a label.
      operationId: listDriveGrantFiles
      tags: [Connectors]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: grantId, in: query, required: true, schema: { type: string } }
        - { name: folder, in: query, description: Defaults to the grant's own folder., schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Files inside the folder
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { type: object, additionalProperties: true }
                  grant: { type: object, additionalProperties: true }
                  folder: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: That folder is outside this agent's grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/drive/instances/{instanceId}/import:
    post:
      summary: Import a Drive file into the knowledge base
      description: Exports the document as text and adds it as a knowledge document, which the normal path then vectorizes. The file must descend from the named grant.
      operationId: importDriveFile
      tags: [Connectors]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grantId]
              properties:
                fileId: { type: string, description: Either this or `url` is required. }
                url: { type: string, format: uri }
                title: { type: string, description: Defaults to the Drive file name. }
                grantId: { type: string }
      responses:
        "201":
          description: Imported — the knowledge document plus the source file's Drive metadata
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  driveFile:
                    type: object
                    properties:
                      id: { type: string }
                      name: { type: string }
                      mimeType: { type: string }
                      webViewLink: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: That file is outside this agent's grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Zoho WorkDrive ────────────────────────────────────────────────────────

  /v1/workdrive/zoho/start:
    get:
      summary: Begin the Zoho WorkDrive connection
