  /v1/agents/{id}/vectors:
    get:
      summary: A template's vector-store inventory
      operationId: getAgentVectors
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
