  # ── Auth (OAuth flows) ────────────────────────────────────────────────────

  /v1/auth/github/start:
    get:
      summary: Begin GitHub sign-in
      description: |
        302-redirects the browser to GitHub's consent screen. On success the callback
        bounces back to `return_to` with `?session=<token>` appended (or `?code=` for the
        MCP caller, which then calls `POST /v1/auth/mcp/exchange`). `return_to` must be on
        the allowlist in `lib/origins.ts`.
      operationId: githubSignInStart
      security: []
      tags: [Auth]
      parameters:
        - name: return_to
          in: query
          required: true
          description: Allowlisted URL to bounce back to with the minted session.
          schema: { type: string, format: uri }
        - name: app_id
          in: query
          description: Calling app. `pags-mcp` receives a one-time `code` instead of a raw session in the URL.
          schema: { type: string }
      responses:
        "302": { description: Redirect to GitHub's OAuth consent screen }
        "400": { description: Missing or disallowed `return_to` }
        "501": { description: GitHub OAuth is not configured on this deployment }

  /v1/auth/github/callback:
    get:
      summary: GitHub OAuth callback
      description: |
        Exchanges the code, upserts the user, mints a PAGS session and redirects back to
        the `return_to` carried in the signed `state`. Also serves the LINK flow (state
        carries `linkUid`), which records the GitHub username on the signed-in account and
        auto-binds the App installations of every org the user belongs to.
      operationId: githubOauthCallback
      security: []
      tags: [Auth]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, description: "HMAC-signed, 10-minute state (30 minutes for the link flow)", schema: { type: string } }
      responses:
        "302": { description: "Redirect back to `return_to` with `?session=` (or `?code=`, or `?github_linked=`)" }
        "400": { description: "Missing code/state, invalid or expired state, or disallowed `return_to`" }
        "401": { description: The OAuth code exchange failed upstream }

  /v1/auth/github/link/start:
    get:
      summary: Link a GitHub identity to the current account
      description: |
        Unlike `/github/start` (which signs in and would create a separate `github:`
        account), this records the GitHub username on the **already signed-in** account, so
        a Google user can authorize the GitHub App and prove org membership without
        abandoning their instances. Returns the consent URL as JSON — the caller holds a
        Bearer, not a cookie. Sets an `HttpOnly` bind cookie the callback checks.
      operationId: githubLinkStart
      tags: [Auth]
      parameters:
        - { name: return_to, in: query, required: true, schema: { type: string, format: uri } }
      responses:
        "200":
          description: The GitHub consent URL to open
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { description: GitHub OAuth is not configured on this deployment }

  /v1/auth/google/start:
    get:
      summary: Begin Google sign-in
      description: 302-redirects to Google's consent screen. Same `return_to` allowlist and bounce-back contract as the GitHub flow.
      operationId: googleSignInStart
      security: []
      tags: [Auth]
      parameters:
        - { name: return_to, in: query, required: true, schema: { type: string, format: uri } }
        - { name: app_id, in: query, schema: { type: string } }
      responses:
        "302": { description: Redirect to Google's OAuth consent screen }
        "400": { description: Missing or disallowed `return_to` }
        "501": { description: Google OAuth is not configured on this deployment }

  /v1/auth/google/callback:
    get:
      summary: Google OAuth callback
      operationId: googleOauthCallback
      security: []
      tags: [Auth]
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: Redirect back to `return_to` with `?session=` (or `?code=`) }
        "400": { description: "Missing code/state, invalid or expired state, or disallowed `return_to`" }
        "401": { description: The Google token exchange failed (the upstream reason is included in the body) }
        "501": { description: Google OAuth is not configured on this deployment }

  /v1/auth/mcp/exchange:
    post:
      summary: Exchange a one-time MCP auth code for a session
      description: |
        Server-to-server swap so the session token never travels in a URL. Fail-closed: a
        missing, malformed, unknown, expired or already-used code all return a bare 400.
      operationId: mcpExchange
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: The session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  # ── Agents: capabilities, settings schema, ops ────────────────────────────

  /v1/agents/{id}/capabilities:
    get:
      summary: Read the agent's declared capabilities
      description: |
        The capability registry entry that decides what this agent IS — which console
        surfaces it shows, whether it needs a local runner, which workflow it drives, and
        its tool allowlist. Owner (or admin) only.
      operationId: getAgentCapabilities
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Declared capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilities"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Declare the agent's capabilities
      description: |
        Merged per key, so an editor can send only what it changed. Values are validated
        against closed enums; `customSurfaces` bundles must be `https` URLs because they
        load as code into the console origin, and are only overwritten when the key is
        present.
      operationId: setAgentCapabilities
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCapabilities"
      responses:
        "200":
          description: The stored capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCapabilities"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/settings-schema:
    get:
      summary: Read the agent's subscriber-settings schema
      description: The typed settings a subscriber can configure on their instance. Owner (or admin) only. Accepts an id or a slug.
      operationId: getAgentSettingsSchema
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The declared schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  settingsSchema:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsField" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Declare the agent's subscriber-settings schema
      description: Whole-object write, sanitised and capped at 12 fields. Unknown field types are dropped rather than stored.
      operationId: setAgentSettingsSchema
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settingsSchema:
                  type: array
                  items: { $ref: "#/components/schemas/SettingsField" }
      responses:
        "200":
          description: The stored schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  settingsSchema:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsField" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/ops:
    get:
      summary: Agent operations status
      description: Billing posture (whether a Cloudflare key is stored and when it was last used), deploy status, and the five most recent executions. Owner only.
      operationId: getAgentOps
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Operations status
          content:
            application/json:
              schema:
                type: object
                properties:
                  agent:
                    type: object
                    properties:
                      id: { type: string }
                      slug: { type: string }
                      name: { type: string }
                      model: { type: string }
                      visibility: { type: string }
                      status: { type: string }
                      workerUrl: { type: string, format: uri }
                  billing:
                    type: object
                    properties:
                      provider: { type: string, example: cloudflare }
                      mode: { type: string, example: user-owned }
                      hasCloudflareKey: { type: boolean }
                      createdAt: { type: string, nullable: true }
                      lastUsedAt: { type: string, nullable: true }
                  deploy:
                    type: object
                    description: Latest GitHub Actions deploy state for the agent's repo.
                    additionalProperties: true
                  executions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        model: { type: string }
                        duration_ms: { type: integer }
                        error: { type: string, nullable: true }
                        created_at: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/deploy:
    post:
      summary: Trigger the agent repo's deploy workflow
      description: Dispatches `deploy.yml` on `main` in the agent's GitHub repo. Owner only.
      operationId: deployAgent
      tags: [Agents]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: Deploy queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  repo: { type: string }
                  org: { type: string }
                  deploy: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The agent has no deploy workflow yet (body carries `queued:false` plus the current deploy status)
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: boolean }
                  message: { type: string }
                  deploy: { type: object, additionalProperties: true }

  # ── Instances: board ──────────────────────────────────────────────────────

  /v1/instances/{instanceId}/board:
    get:
      summary: Read the instance work board
      description: |
        Runtime tasks and work records folded into the agent's configured columns, with any
        durable human status override applied. Read from the D1 mirror, so it works even
        when no runner is connected.
      operationId: getInstanceBoard
      tags: [Board]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items: { $ref: "#/components/schemas/BoardColumn" }
                  items:
                    type: array
                    description: >
                      Cards, each already assigned to a column. `threadTurns` counts the
                      per-ticket conversation on the card's `latestTaskId` — the ticket the
                      card opens — so a board can show that a ticket has been questioned
                      without reading every thread.
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/board/status:
    post:
      summary: Move a card to a column
      description: |
        Writes a durable human status override for one card. An empty `status` resets it to
        whatever the automation says. The status is validated against the agent's actual
        columns — an unknown one is rejected rather than silently parked. The display fields
        are snapshotted so a moved card survives its runs being cleared.
      operationId: setBoardItemStatus
      tags: [Board]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobKey]
              properties:
                jobKey: { type: string, description: The card's stable key. }
                status: { type: string, description: A column id or one of its declared statuses. Empty resets to automation. }
                title: { type: string }
                subtitle: { type: string }
                url: { type: string, format: uri }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/board-config:
    get:
      summary: Read the instance board configuration
      description: The columns this board shows, the preferred view, whether the columns are a per-instance override or the agent's own, and the agent's defaults (for a reset affordance).
      operationId: getInstanceBoardConfig
      tags: [Board]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Board configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items: { $ref: "#/components/schemas/BoardColumn" }
                  view: { type: string, enum: [kanban, list] }
                  isOverride: { type: boolean }
                  agentColumns:
                    type: array
                    items: { $ref: "#/components/schemas/BoardColumn" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Set a per-instance board override
      description: "The owner-editable layer over the agent's declared columns. `columns: null` (or an empty array) resets to the agent's own."
      operationId: setInstanceBoardConfig
      tags: [Board]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                columns:
                  type: array
                  nullable: true
                  items: { $ref: "#/components/schemas/BoardColumn" }
                view: { type: string, enum: [kanban, list] }
      responses:
        "200":
          description: The stored configuration
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Instances: tickets beyond the runner ──────────────────────────────────

  /v1/instances/{instanceId}/tasks/direct:
    post:
      summary: Create a ticket directly on the board
      description: |
        Writes a ticket to the D1 mirror without going through a local runner — the path a
        cloud-only agent uses. A ticket may carry `action`/`config`/`params`, in which case
        it is ACTIONABLE: approving it executes exactly that declared work through the same
        path a trigger or connection uses. The action is fixed at creation by the owner's own
        agent, so approving chooses whether the declared work runs — it can never substitute
        new work. An actionable ticket defaults to `needs_approval`; a plain one to
        `completed` (it is a record, not pending work).
      operationId: createDirectTicket
      tags: [Board]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 2000 }
                reasoning: { type: string, maxLength: 8000 }
                status: { type: string }
                type: { type: string, default: ticket }
                id: { type: string, description: Optional caller-supplied id (else a UUID is generated). }
                action: { type: string, description: Trigger action to run on approval — same vocabulary as triggers and connections. }
                config: { type: object, additionalProperties: true }
                params: { type: object, additionalProperties: true }
      responses:
        "201":
          description: The created ticket
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/tasks/{taskId}/run:
    post:
      summary: Run an actionable ticket
      description: |
        The runner-less approval gate. Executes the ticket's declared `action` and moves it
        to completed or failed. Claimed with an atomic status update, so a double-click
        cannot run it twice.
      operationId: runActionableTicket
      tags: [Board]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Execution result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/instances/{instanceId}/tasks/{taskId}/thread:
    get:
      summary: Read a ticket's conversation
      description: |
        The scoped question-and-answer thread for ONE ticket, oldest first. Turns are ordinary
        task events (`ticket.question` / `ticket.answer`) on the same append-only stream the
        ticket's activity uses, so a thread is deleted with its ticket.
      operationId: getTicketThread
      tags: [Board]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The ticket's turns
          content:
            application/json:
              schema:
                type: object
                properties:
                  turns:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        role: { type: string, enum: [user, agent] }
                        text: { type: string }
                        at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Ask a ticket a question
      description: |
        Ask the agent about THIS ticket — why it decided what it did, what it recorded, what
        approving it would run. The answer is grounded in that ticket's own record (its
        reasoning, declared action and activity) and nothing else, so the same question on two
        tickets gets two answers. The thread has NO tools: it explains work that already
        happened and can never start work or change the ticket — approving remains the only way
        to run a ticket's declared action. The question is persisted before the model call, so
        an inference failure still leaves it on the ticket.
      operationId: askTicket
      tags: [Board]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: The persisted question and the agent's answer
          content:
            application/json:
              schema:
                type: object
                properties:
                  question: { type: object, additionalProperties: true }
                  answer: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { description: No BYOK provider key configured for this account. }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/tasks/{taskId}/hint:
    post:
      summary: Send guidance to a paused task
      description: Free-text hint stored on the mirrored task; the agent's brain reads it when it resumes.
      operationId: hintTask
      tags: [Board]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hint]
              properties:
                hint: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/tasks/clear-finished:
    post:
      summary: Clear finished tickets from the board
      description: Removes failed, done and cancelled tasks and their board items.
      operationId: clearFinishedTasks
      tags: [Board]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  cleared: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Instances: trace ──────────────────────────────────────────────────────

  /v1/instances/{instanceId}/trace:
    get:
      summary: Unified run trace
      description: |
        The complete time-ordered timeline of what this agent DID — chat turns, tool calls,
        apply steps, handoffs, outcomes and bridged failures — so a run can be reconstructed
        from one place. This is the primary debugging surface. Owner only.
      operationId: getInstanceTrace
      tags: [Trace]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: trace_id, in: query, description: Narrow to one run or turn. Also accepted as `traceId`., schema: { type: string } }
        - { name: source, in: query, description: "Event source, e.g. `chat`, `apply`, `tool`, `pipeline`.", schema: { type: string } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
        - { name: limit, in: query, schema: { type: integer, default: 200 } }
      responses:
        "200":
          description: Trace events, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceId: { type: string }
                  count: { type: integer }
                  events:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Instances: settings, name, runner node ────────────────────────────────

  /v1/instances/{instanceId}/settings:
    get:
      summary: Read typed agent settings
      description: Values merged over the schema's defaults. `fields` rides along so a settings UI never depends on a stale cache.
      operationId: getInstanceSettings
      tags: [Instances]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Settings and their schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { type: object, additionalProperties: true }
                  fields:
                    type: array
                    items: { $ref: "#/components/schemas/SettingsField" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Save typed agent settings
      description: |
        Patch semantics — only the fields sent change. A field declared `voiceLanguage: true`
        is applied live to STT/TTS rather than copied into the voice override. On a coding
        agent with no repos yet, a `repo` setting also attaches that repo once.
      operationId: setInstanceSettings
      tags: [Instances]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The resolved settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { type: object, additionalProperties: true }
        "400":
          description: This agent declares no settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/name:
    put:
      summary: Rename this instance
      description: Per-instance display name, so several instances of the same agent are distinguishable. An empty name reverts to the agent's name.
      operationId: renameInstance
      tags: [Instances]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
      responses:
        "200":
          description: The new name (`null` when cleared)
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/runner-node:
    get:
      summary: Read the machine this instance is pinned to
      description: |
        A platform primitive, not a Coder-specific one: any agent can be pinned to a
        connected node, and its runner calls route there. `connected` is this agent's own
        relay socket; `nodeOnline` is whether the machine is up for any agent — which is what
        distinguishes "machine offline" from "machine online but this agent never attached".
      operationId: getRunnerNode
      tags: [Runtime]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Current pin plus the nodes available to pin to
          content:
            application/json:
              schema:
                type: object
                properties:
                  runnerNode: { type: string, nullable: true }
                  nodes:
                    type: array
                    items: { type: string }
                  nodesDetail:
                    type: array
                    items:
                      type: object
                      properties:
                        node: { type: string }
                        connected: { type: boolean }
                        nodeOnline: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Pin (or unpin) the machine this instance runs on
      description: An empty or null `runnerNode` clears the pin, after which routing follows whichever relay socket is live.
      operationId: setRunnerNode
      tags: [Runtime]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runnerNode: { type: string, nullable: true }
      responses:
        "200":
          description: The stored pin
          content:
            application/json:
              schema:
                type: object
                properties:
                  runnerNode: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Voice ─────────────────────────────────────────────────────────────────

  /v1/instances/{instanceId}/voice-settings:
    get:
      summary: Read resolved voice settings
      description: |
        The fully-resolved configuration this agent actually uses. `hasOverride` is presence,
        not value equality — an override whose fields happen to match your account defaults is
        still an override.
      operationId: getVoiceSettings
      tags: [Voice]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Resolved voice settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  voiceSettings: { $ref: "#/components/schemas/VoiceSettings" }
                  hasOverride: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Write a per-agent voice override
      description: |
        Sanitised against your ACCOUNT default, so a partial body keeps the rest of your
        preferences instead of snapping unspecified fields to platform defaults. Strict on
        write — an unknown field or an unsupported provider is a 400, not a silent fallback.
      operationId: setVoiceSettings
      tags: [Voice]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoiceSettings" }
      responses:
        "200":
          description: The resolved settings after the write
          content:
            application/json:
              schema:
                type: object
                properties:
                  voiceSettings: { $ref: "#/components/schemas/VoiceSettings" }
                  hasOverride: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Drop the per-agent voice override
      description: '"Use my defaults" — absence is what the resolver reads.'
      operationId: clearVoiceSettings
      tags: [Voice]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: The account defaults now in effect
          content:
            application/json:
              schema:
                type: object
                properties:
                  voiceSettings: { $ref: "#/components/schemas/VoiceSettings" }
                  hasOverride: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/voice-audio/{turnId}:
    put:
      summary: Save a voice turn's recording
      description: |
        Raw audio bytes (not JSON) stored in R2 so the message can be replayed later. Max 5MB;
        the `Content-Type` you send is preserved (defaults to `audio/webm`). Recordings are
        deleted when the chat is cleared.
      operationId: putVoiceAudio
      tags: [Voice]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: turnId, in: path, required: true, description: "Sanitised to `[A-Za-z0-9_-]`, max 64 chars.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  turnId: { type: string }
        "400":
          description: Empty body, bad turnId, or larger than 5MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Fetch a saved voice recording
      description: Streams the stored audio. Owner only; cached privately.
      operationId: getVoiceAudio
      tags: [Voice]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: turnId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The audio bytes
          content:
            audio/webm:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Translation ───────────────────────────────────────────────────────────

  /v1/instances/{instanceId}/translation:
    get:
      summary: Read the under-message translation config
      operationId: getTranslationConfig
      tags: [Translation]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Config, whether it is a per-agent override, and the supported languages
          content:
            application/json:
              schema:
                type: object
                properties:
                  translation: { $ref: "#/components/schemas/TranslationConfig" }
                  hasOverride: { type: boolean }
                  languages:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        tag: { type: string, description: BCP-47 tag. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Save the translation config
      description: Sanitised against your account default, so a partial body keeps the rest. The target language is validated against the supported list.
      operationId: setTranslationConfig
      tags: [Translation]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TranslationConfig" }
      responses:
        "200":
          description: The stored config
          content:
            application/json:
              schema:
                type: object
                properties:
                  translation: { $ref: "#/components/schemas/TranslationConfig" }
                  hasOverride: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Drop the per-agent translation override
      operationId: clearTranslationConfig
      tags: [Translation]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: The account defaults now in effect
          content:
            application/json:
              schema:
                type: object
                properties:
                  translation: { $ref: "#/components/schemas/TranslationConfig" }
                  hasOverride: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/translate:
    post:
      summary: Translate a chat message
      description: |
        Translates into the instance's configured target language, and — when
        `transliterate` is on — also returns word-by-word `[original, romanization]` pairs for
        the interlinear display. Uses platform Workers AI when enabled, otherwise the owner's
        BYOK key.
      operationId: translateMessage
      tags: [Translation]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 2000 }
      responses:
        "200":
          description: The translation, plus the gloss when transliteration is on
          content:
            application/json:
              schema:
                type: object
                properties:
                  translation: { type: string }
                  transliteration: { type: string }
                  pairs:
                    type: array
                    description: Up to 400 `[original, romanization]` pairs covering the whole message in order.
                    items:
                      type: array
                      items: { type: string }
        "400":
          description: Translation is not enabled for this instance, or `text` is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: No AI provider responded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Apply pipeline ────────────────────────────────────────────────────────

  /v1/instances/{instanceId}/apply:
    post:
      summary: Start a job application
      description: |
        Kicks off the durable `JobApplyWorkflow`, whose LLM brain drives the connected
        browser runner page by page (snapshot → decide one action → act). Returns
        immediately with the workflow and task ids; progress lands on the board and in the
        trace. Requires Pro (the workflow drives a local runner).

        `dryRun: true` fills everything but a runtime guard in the workflow BLOCKS the final
        submit click — the brain cannot override it. Omit it (or send `false`) to apply for
        real.

        Concurrent applies on the same instance are single-flighted: the loser gets 409.
      operationId: startApply
      tags: [Apply]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, description: The job posting or application URL. }
                resumePath: { type: string, description: "Path the runner should upload. Also accepted as `resume_path`." }
                candidate: { type: object, additionalProperties: true, description: Overrides layered over the stored Profile. }
                coverNote: { type: string, description: "Also accepted as `cover_note`." }
                dryRun: { type: boolean, default: false, description: "Fill but never submit. Also accepted as `dry_run`." }
      responses:
        "202":
          description: Workflow started
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflowId: { type: string }
                  taskId: { type: string }
                  status: { type: string, example: running }
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: An apply is already in flight for this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The runner could not be reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/instances/{instanceId}/input:
    post:
      summary: Supply a value the agent asked for
      description: |
        The ask-and-hold (`needs_input`) handoff: the prompt forbids fabricating a required
        value, so the run pauses and asks. This delivers the answer to the live runner and
        resumes. A lost handoff (the runner restarted) is reported as 409 rather than a
        misleading 200.
      operationId: supplyApplyInput
      tags: [Apply]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId: { type: string }
                value: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The takeover session is gone — re-run and answer again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/apply-tips:
    get:
      summary: Learned per-ATS tips
      description: |
        What worked and what failed on each applicant-tracking system, fed back into the
        prompt on the next run. Gated on the declared `apply` surface — any other agent gets
        an empty list, because the cache is per-user and must not surface a user's
        application history inside an unrelated agent.
      operationId: getApplyTips
      tags: [Apply]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Tips, keyed by ATS host
          content:
            application/json:
              schema:
                type: object
                properties:
                  tips:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/instructions:
    get:
      summary: Read Special Instructions
      description: The owner's free-text rules for this instance, injected at the TOP of the agent's prompt so they override defaults.
      operationId: getInstructions
      tags: [Instances]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: The stored instructions
          content:
            application/json:
              schema:
                type: object
                properties:
                  instructions: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update Special Instructions
      operationId: setInstructions
      tags: [Instances]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instructions: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/apply-resume:
    put:
      summary: Upload the résumé
      description: |
        Raw bytes (not multipart), max 8MB, stored in R2 so a remote runner can fetch it.
        A PDF is parsed with the owner's BYOK Claude after the response — best-effort — to
        pre-fill empty Profile fields and seed the vector KB.
      operationId: uploadResume
      tags: [Apply]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: query, description: "File name (sanitised, max 120 chars). Defaults to `resume.pdf`.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/pdf:
            schema: { type: string, format: binary }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
                  size: { type: integer }
        "400":
          description: Empty body, or larger than 8MB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: Download the résumé with a signed link
      description: |
        **Not a Bearer route.** The HMAC query signature IS the authentication, so a remote
        runner on the owner's machine can fetch the file without holding a session token. The
        signature is minted by the apply workflow and expires in about two hours.
      operationId: downloadResumeSigned
      security: []
      tags: [Apply]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: uid, in: query, required: true, schema: { type: string } }
        - { name: exp, in: query, required: true, description: Expiry in epoch milliseconds., schema: { type: integer, format: int64 } }
        - { name: token, in: query, required: true, description: "HMAC over `uid.instanceId.exp`, compared in constant time.", schema: { type: string } }
      responses:
        "200":
          description: The résumé bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          description: Missing, expired, or invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No résumé on file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Remove the stored résumé
      operationId: deleteResume
      tags: [Apply]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/apply-resume/status:
    get:
      summary: Is a résumé on file?
      operationId: resumeStatus
      tags: [Apply]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Résumé presence and metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploaded: { type: boolean }
                  name: { type: string, nullable: true }
                  size: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/apply-resume/parse:
    post:
      summary: Re-parse the résumé already on file
      description: Fills empty Profile fields and re-seeds the KB without a re-upload. Runs after the response; the body only confirms it started.
      operationId: parseResume
      tags: [Apply]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Parsing started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  parsing: { type: boolean }
                  name: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No résumé on file — upload one first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/instances/{instanceId}/takeover:
    get:
      summary: List active human-takeover sessions
      description: Proxied to the live runner. Summary level — the body shape is the runner's.
      operationId: listTakeovers
      tags: [Apply]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/takeover/{taskId}/frame:
    get:
      summary: Live frame of a paused task's browser page
      description: Proxied to the live runner; returns a JSON envelope carrying a JPEG frame, not raw image bytes.
      operationId: getTakeoverFrame
      tags: [Apply]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/takeover/{taskId}/input:
    post:
      summary: Relay human input into the taken-over page
      description: The request body is forwarded verbatim to the runner's takeover input endpoint (mouse and keyboard events).
      operationId: takeoverInput
      tags: [Apply]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/takeover/{taskId}/resume:
    post:
      summary: Resume after a human solved the challenge
      operationId: takeoverResume
      tags: [Apply]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/takeover/{taskId}/end:
    post:
      summary: End a human-takeover session
      operationId: takeoverEnd
      tags: [Apply]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/tasks/{taskId}/shots/{seq}:
    get:
      summary: Per-step run screenshot
      description: One frame of the run-replay timeline. Owner only.
      operationId: getRunShot
      tags: [Apply]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
        - { name: seq, in: path, required: true, description: Step sequence number., schema: { type: integer } }
      responses:
        "200":
          description: The screenshot
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Credentials vault ─────────────────────────────────────────────────────

  /v1/instances/{instanceId}/credentials:
    get:
      summary: List stored site logins
      description: Summaries only — password, PIN and recovery codes are never returned here. They are envelope-encrypted (AES-256-GCM data key wrapped under the master key).
      operationId: listCredentials
      tags: [Credentials]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Credential summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        domain: { type: string }
                        loginUrl: { type: string, nullable: true }
                        username: { type: string, nullable: true }
                        comments: { type: string, nullable: true }
                        createdAt: { type: string }
                        updatedAt: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Store a site login
      description: '`domain` is matched by host suffix at apply time, so `dayforcehcm.com` covers `jobs.dayforcehcm.com`.'
      operationId: createCredential
      tags: [Credentials]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                loginUrl: { type: string, format: uri, description: "Also accepted as `login_url`." }
                username: { type: string }
                password: { type: string, format: password }
                pin: { type: string }
                recoveryCodes: { type: string, description: "Also accepted as `recovery_codes`." }
                comments: { type: string }
                recoveryHistory: { type: string, description: "Also accepted as `recovery_history`." }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/credentials/{id}:
    put:
      summary: Update a stored login
      description: Secrets are left unchanged unless supplied.
      operationId: updateCredential
      tags: [Credentials]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain: { type: string }
                loginUrl: { type: string, format: uri }
                username: { type: string }
                password: { type: string, format: password }
                pin: { type: string }
                recoveryCodes: { type: string }
                comments: { type: string }
                recoveryHistory: { type: string }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a stored login
      operationId: deleteCredential
      tags: [Credentials]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/credentials/{id}/reveal:
    get:
      summary: Reveal one credential's secrets
      description: |
        The only path that returns the decrypted values, and only to the owner. Deliberately
        NOT exposed over MCP. Note that the current design is server-held-key encryption, not
        zero-knowledge.
      operationId: revealCredential
      tags: [Credentials]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The decrypted credential
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  domain: { type: string }
                  loginUrl: { type: string, nullable: true }
                  username: { type: string, nullable: true }
                  password: { type: string, nullable: true }
                  pin: { type: string, nullable: true }
                  recoveryCodes: { type: string, nullable: true }
                  comments: { type: string, nullable: true }
                  recoveryHistory: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Instance storage: collections + records ───────────────────────────────
  #
  # These proxy the instance's Durable Object. Record shapes are defined by the
  # collection's own schema, so responses are documented as open objects rather than
  # invented fields.

  /v1/instances/{instanceId}/collections:
    get:
      summary: List collections
      operationId: listInstanceCollections
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Collections with their schemas and record counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a collection
      description: Lets an agent surface self-provision structured storage. The body declares the collection name, its field schema, indexes and unique constraints.
      operationId: createInstanceCollection
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/collections/{name}:
    delete:
      summary: Delete a collection and its records
      operationId: deleteInstanceCollection
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/collections/{name}/records:
    get:
      summary: Query records
      description: Query-string filters are forwarded to the Durable Object's record query (field filters, `limit`, `offset`).
      operationId: queryInstanceRecords
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Matching records
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Insert a record
      description: Validated against the collection's schema, including its unique constraints and dedup guard.
      operationId: insertInstanceRecord
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/collections/{name}/records/{recordId}:
    get:
      summary: Read one record
      operationId: getInstanceRecord
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update one record
      operationId: updateInstanceRecord
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete one record
      operationId: deleteInstanceRecord
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Instance storage: files ───────────────────────────────────────────────

  /v1/instances/{instanceId}/files:
    get:
      summary: List files
      operationId: listInstanceFiles
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: File metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Upload a small file
      description: |
        JSON body carrying the file's name, MIME type and (base64 or text) content. Text
        files are auto-extracted and vectorized. For anything large use the resumable
        multipart family below.
      operationId: uploadInstanceFile
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/files/{fileId}:
    get:
      summary: Download a file
      description: Streams the raw bytes from R2 (not a JSON envelope) — powers download and in-console preview.
      operationId: downloadInstanceFile
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The file bytes, with the stored content type
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a file
      operationId: deleteInstanceFile
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: fileId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/files/multipart/create:
    post:
      summary: Start a resumable upload
      description: |
        R2 multipart. The upload session lives in R2 keyed by (key, uploadId) until completed
        or aborted, so the client can lose its connection, pause, or close the tab and resume
        by re-sending only the parts it has no etag for. Both `fileId` and `key` are derived
        SERVER-side and the key is the authority on what the upload is — `complete` re-derives
        identity from it rather than trusting the body. Cap: 2GB.
      operationId: createMultipartUpload
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                name: { type: string, description: "Sanitised server-side to `[\\w.\\- ()]`, max 120 chars." }
                mimeType: { type: string, default: application/octet-stream }
                size: { type: integer, description: Declared byte size. Advisory — the real size is enforced against R2 after completion. }
      responses:
        "200":
          description: The upload session to persist for resume
          content:
            application/json:
              schema:
                type: object
                properties:
                  fileId: { type: string }
                  key: { type: string }
                  uploadId: { type: string }
                  partSize: { type: integer, description: Server-declared so resume maths cannot drift (10MiB). }
                  partCount: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Larger than the 2GB cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/files/multipart/{uploadId}/part:
    put:
      summary: Upload one part
      description: Raw bytes. Re-sending a part number replaces it, so retries are safe. All non-final parts must be exactly `partSize`.
      operationId: uploadMultipartPart
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: key, in: query, required: true, description: The key returned by `create`. Must sit under this instance's prefix. , schema: { type: string } }
        - { name: partNumber, in: query, required: true, description: "1-based, bounded by the 2GB cap rather than R2's 10,000-part ceiling.", schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The part's etag, to be sent back on complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  partNumber: { type: integer }
                  etag: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The key does not belong to this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The upload session expired or was aborted — restart it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/files/multipart/{uploadId}/complete:
    post:
      summary: Complete a resumable upload
      description: |
        Completes the R2 object, then registers it with the instance's Durable Object
        (metadata, text extraction, vectorization) — the same end state as a normal upload.
        `fileId` and `name` may be sent but are only checked against the key; the key decides.
      operationId: completeMultipartUpload
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, parts]
              properties:
                key: { type: string }
                fileId: { type: string, description: Optional assertion; must match the key. }
                name: { type: string, description: Optional assertion; must match the key. }
                mimeType: { type: string }
                parts:
                  type: array
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer }
                      etag: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The key does not belong to this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Completion failed (expired or inconsistent parts)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The finished object exceeds the 2GB cap — it is deleted rather than registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/instances/{instanceId}/files/multipart/{uploadId}:
    delete:
      summary: Abort a resumable upload
      description: Frees the parts stored in R2. Aborting twice is fine.
      operationId: abortMultipartUpload
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: uploadId, in: path, required: true, schema: { type: string } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Aborted
          content:
            application/json:
              schema: { type: object, properties: { aborted: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The key does not belong to this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ── Instance storage: search, vectors, activity, memory, state ────────────

  /v1/instances/{instanceId}/search:
    post:
      summary: Vector search over this instance's knowledge
      operationId: searchInstance
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                limit: { type: integer }
      responses:
        "200":
          description: Scored matches
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/vectors:
    get:
      summary: Vector-store inventory
      description: |
        What is actually indexed, grouped by source (file, document, repo) with chunk and
        character counts and a preview. Pair it with `/search` to answer "why didn't it know
        X".
      operationId: getInstanceVectors
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Inventory grouped by source
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/activity:
    get:
      summary: Activity log
      description: Append-only events — chat turns, tool calls, file uploads, record mutations.
      operationId: getInstanceActivity
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/memory:
    get:
      summary: Read instance memory
      description: |
        Five memory types (identity, knowledge, preference, skill, context), each carrying a
        `source` (`agent`, `user` or `summary`). User-set entries are marked in the prompt and
        the agent must not overwrite them unasked.
      operationId: getInstanceMemory
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Memory entries
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Write instance memory
      description: "Writes made through this route are tagged `source: user` and protected from agent overwrite."
      operationId: setInstanceMemory
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/memory/{key}:
    delete:
      summary: Delete one memory entry
      description: Deleting a key that does not exist fails honestly rather than reporting success.
      operationId: deleteInstanceMemory
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/agent-tasks:
    get:
      summary: Read the agent's own task list
      description: |
        The instance Durable Object's task store — written by the agent's BASE `create_task`
        tool and injected into its system prompt every turn. **Not** the Board: that is
        `/v1/instances/{instanceId}/tasks`, a separate runtime work queue.

        Each task carries `assignedBy` as provenance (`user` = owner-written, marked
        `(user-set)` in the prompt and protected from the agent retiring it unasked; `self` =
        the agent wrote it). `stale` marks a task nothing has updated for `limits.staleDays` —
        it stays stored and listed but stops being injected; any edit revives it. At most
        `limits.injected` tasks reach the prompt, most recently updated first.
      operationId: getInstanceAgentTasks
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Tasks plus the store's limits
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { type: object, additionalProperties: true }
                  limits:
                    type: object
                    properties:
                      max: { type: integer }
                      injected: { type: integer }
                      staleDays: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a task to the agent's task list
      description: "Tasks created through this route are `assignedBy: user` and protected from the agent retiring them unasked. Fails with 409 once the store reaches its task limit."
      operationId: createInstanceAgentTask
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
      responses:
        "201":
          description: The created task
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Task limit reached — complete or delete some first

  /v1/instances/{instanceId}/agent-tasks/{taskId}:
    put:
      summary: Edit one of the agent's tasks
      description: |
        Title, description and status. An edit through this route takes ownership of the task
        (`assignedBy: user`), the same way a memory edit becomes `source: user` — provenance
        only ever moves agent → owner. Editing also refreshes `updatedAt`, which revives a
        task that had aged out of the prompt.
      operationId: updateInstanceAgentTask
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                status: { type: string, enum: [pending, in_progress, blocked, complete] }
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete one of the agent's tasks
      description: Deleting a task that does not exist fails honestly rather than reporting success.
      operationId: deleteInstanceAgentTask
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/state:
    get:
      summary: Read the instance's Durable Object state
      description: Identity, personality, goal, model and guardrails as the DO holds them.
      operationId: getInstanceState
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: DO state
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update the instance's Durable Object state
      description: |
        Includes `permissions` — for example `permissions.email`, which is what exposes the
        Gmail-reading `find_confirmation_link` tool. Deliberately NOT exposed over MCP: this
        is a security boundary the owner crosses explicitly.
      operationId: setInstanceState
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Repo Chat ingestion ───────────────────────────────────────────────────

  /v1/instances/{instanceId}/ingest-repo:
    post:
      summary: Index a GitHub repository
      description: |
        Fetches the repo tarball (one request), filters to text and code files, and embeds
        them into this instance's vector store as `sourceType: repo`. Progress advances in a
        batched Durable Object alarm, one repo per tick, so a large repo cannot blow the
        worker's time budget. Public repos need no auth; private repos use the GitHub App
        installation token when configured. Re-posting an already-indexed repo re-indexes it.
        Max 20 repos per instance.
      operationId: ingestRepo
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repoUrl]
              properties:
                repoUrl: { type: string, format: uri, description: A GitHub repository URL. }
                branch: { type: string, description: Defaults to the repository's default branch. }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400":
          description: Missing or unrecognisable GitHub repository URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/ingest-repo/status:
    get:
      summary: Indexed repositories and their progress
      operationId: ingestRepoStatus
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: One entry per repo, with phase and counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        key: { type: string, example: owner/name }
                        phase: { type: string, enum: [fetching, indexing, summarizing, done, error] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/ingest-repo/clear:
    post:
      summary: Remove indexed repositories
      description: '`{repoUrl}` or `{key}` removes one repo and its vectors; an empty body clears all of them.'
      operationId: clearIngestedRepo
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                repoUrl: { type: string, format: uri }
                key: { type: string, example: owner/name }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Tools, connectors, connections ────────────────────────────────────────

  /v1/instances/{instanceId}/tools:
    get:
      summary: Every registry tool, with this instance's verdict on it
      description: |
        Returns the FULL list, not only the runnable ones — "what can this agent do" is only
        answerable if the answer also says what it can't and why. Each entry carries `allowed`
        (the gate's decision), `disabled` (the owner switched it off) and `reason`.
      operationId: listInstanceTools
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: allowed, in: query, description: Send `true` to narrow to the runnable set., schema: { type: string, enum: ["true"] } }
      responses:
        "200":
          description: The tool policy for this instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        connector: { type: string, description: "The connector that provides it — and the one whose write consent applies. Not always the agent's surface name: a `tmux`-surface agent's tools come from the `terminal` connector." }
                        scope: { type: string, enum: [read, write] }
                        allowed: { type: boolean, description: "Is this tool part of this agent at all (declared, and not switched off by the owner)? Deliberately NOT folded with write consent — see `writeConsent`." }
                        disabled: { type: boolean }
                        reason: { type: string, enum: [ok, not_declared, disabled_by_owner], description: "Why `allowed` is what it is." }
                        writeConsent:
                          type: string
                          enum: [n/a, granted, required, per_call]
                          description: >-
                            The SEPARATE write-consent verdict (#351). `required` means the tool is this agent's
                            but every call is refused until write access for `connector` is granted. `per_call`
                            means the answer is decided per call: a caller-chosen HTTP method (`http_request`,
                            #307 — reads run, a mutating verb is refused), or outbound MCP (#262 — each call also
                            needs a grant for that endpoint and remote tool).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/mcp/consent:
    get:
      summary: This instance's outbound-MCP grants, per server and per remote tool
      description: |
        Separate from the connector-level consent because a connector row cannot name a server:
        the MCP endpoint is user config, so one `mcp`/write grant used to reach EVERY MCP server
        the instance could name. These rows name it.

        Each grant carries `destructive` — the same name test the enforcement uses, returned so
        the console can explain why a `*` grant doesn't cover a particular tool instead of
        re-deriving the rule client-side and drifting from it.
      operationId: listInstanceMcpConsent
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      responses:
        "200":
          description: The outbound-MCP grants on this instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items:
                      type: object
                      properties:
                        endpoint: { type: string, description: Normalized https MCP endpoint. }
                        tool: { type: string, description: 'A remote tool name, or `*` for every non-destructive tool on that server.' }
                        destructive: { type: boolean, description: "Advisory for the UI. Judged on the tool name WE send — never the server's own `destructiveHint`, which is authored by the party being defended against." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Grant or revoke one remote MCP tool on one server
      description: |
        Granting reach to a specific server IS a decision to let this agent write via MCP, so the
        outer connector gate is satisfied in the same explicit action rather than left as a second
        checkbox the user must discover after the first silently does nothing. The implication runs
        one way only — granting the connector still names no server.

        `tool` accepts `*`, which covers a server's ordinary tools but NOT destructive-looking names.
      operationId: setInstanceMcpConsent
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, tool, enabled]
              properties:
                url: { type: string, description: An https MCP endpoint, e.g. `https://example.com/mcp`. }
                tool: { type: string, maxLength: 128, description: 'A remote tool name, or `*`.' }
                enabled: { type: boolean }
      responses:
        "200":
          description: The resulting grant
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  endpoint: { type: string }
                  tool: { type: string }
                  enabled: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/mcp/credentials:
    get:
      summary: Which MCP servers this account holds a credential for
      description: |
        Credential material for the outbound MCP connector is scoped to ONE normalized endpoint —
        the same key `/mcp/consent` grants on. It used to live in the account's single
        `user_api_keys` row at provider `mcp`, which meant one bearer token for every
        authenticated MCP server the user could name; since the endpoint is config supplied at
        call time, a token issued by server A was sent verbatim to server B the moment anything
        pointed at B.

        Metadata only. There is no reveal route: unlike an AI provider key, an MCP server token
        has no client-side use, so reading it back would be attack surface for no benefit. The
        response never contains a token, a token prefix, or a token length.

        `legacy.present` reports whether the account still holds the old provider-wide token. It
        is bound to no server and is never sent — it is reported so the console can offer to bind
        it to one server (`adoptLegacy`) or discard it, rather than leaving a user whose agent
        stopped working to read the change as data loss.
      operationId: listInstanceMcpCredentials
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      responses:
        "200":
          description: Credential metadata per endpoint, plus the legacy-token state
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items:
                      type: object
                      properties:
                        endpoint: { type: string, description: Normalized https MCP endpoint this credential is bound to. }
                        authMode: { type: string, enum: [bearer, oauth], description: How the credential was obtained. }
                        issuer: { type: string, nullable: true, description: Authorization server, when the endpoint published one. }
                        scopes: { type: string, nullable: true, description: Space-delimited, when the issuer stated them. }
                        expiresAt: { type: string, nullable: true, description: ISO-8601. Null means it does not expire on us. }
                        expired: { type: boolean, description: Derived from `expiresAt` at read time, never stored — so it cannot go stale. }
                        accountLabel: { type: string, nullable: true }
                        createdAt: { type: string }
                        updatedAt: { type: string }
                  legacy:
                    type: object
                    properties:
                      present: { type: boolean, description: The account still holds the old provider-wide `mcp` token. Never sent to any server. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Store the access token for one MCP server
      description: |
        Binds credential material to ONE normalized endpoint. Replacing or removing a credential
        for one server does not affect any other server — that isolation is the point of keying on
        the endpoint.

        Pass `adoptLegacy: true` instead of `token` to bind the account's old provider-wide token
        to this server without re-typing it. The ciphertext is copied verbatim under the same KEK,
        so no plaintext is produced to perform the move.

        The token is envelope-encrypted at rest (per-row AES-256-GCM DEK wrapped with AES-KW under
        `KEY_ENCRYPTION_KEY`), and the response echoes only the endpoint — not a token prefix, not
        a length — because a confirmation string is a credential fragment in a response body, a log
        and a browser history entry.
      operationId: setInstanceMcpCredential
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: An https MCP endpoint, e.g. `https://example.com/mcp`. Normalized before storage, so it matches what the connector resolves on. }
                token: { type: string, maxLength: 8192, description: The access token this server issued. Required unless `adoptLegacy` is set. }
                adoptLegacy: { type: boolean, description: Bind the account's unbound legacy MCP token to this endpoint instead of supplying a new one. }
                authMode: { type: string, enum: [bearer, oauth], default: bearer }
                issuer: { type: string, description: Authorization server, when known. }
                scopes: { type: string, description: Space-delimited scopes, when known. }
                expiresAt: { type: string, description: ISO-8601. Past this, calls fail closed with a reconnect prompt rather than sending a dead token. }
                accountLabel: { type: string, description: Non-secret display hint. }
      responses:
        "200":
          description: The credential was stored for that endpoint
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  endpoint: { type: string }
                  authMode: { type: string }
                  adoptedLegacy: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Forget one MCP server's credential, or discard the unbound legacy token
      description: |
        Pass `url` to remove the credential for that endpoint; every other endpoint's credential is
        untouched. Pass `legacy=1` to discard the account's old provider-wide token, so the
        "bound to no server" notice is clearable rather than permanent.

        `removed` reports whether anything was actually deleted, so the console can tell
        "disconnected" from "there was never a credential here" instead of claiming success either way.
      operationId: deleteInstanceMcpCredential
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: url, in: query, schema: { type: string }, description: An https MCP endpoint. Required unless `legacy` is set. }
        - { name: legacy, in: query, schema: { type: string }, description: Any value discards the account's unbound legacy MCP token instead. }
      responses:
        "200":
          description: What was removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  endpoint: { type: string }
                  legacy: { type: boolean }
                  removed: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/mcp/test:
    post:
      summary: Connect to an MCP endpoint and report what is actually true about it
      description: |
        The connection-setup diagnostic: validate the URL, negotiate the protocol, discover the
        server's tool catalog, and say which of those tools THIS agent could actually call.

        The last part is the point. Reachability and permission are different questions, and a
        test that answers only the first reports success while every real call is still refused —
        a failure the owner then discovers as "the agent silently does nothing". So the response
        carries all three gates a real `mcp_call_tool` passes (the agent's declared tool
        allowlist, the connector-level write consent, the per-server/per-tool grant) and every
        discovered tool says whether it is callable and which gate blocks it.

        Discovery uses `tools/list`, which is read-scoped and needs no consent — you cannot
        approve tools you cannot enumerate.

        On a successful connection it also probes the two READ surfaces (`resources/list` and
        `prompts/list`) and reports each under `resources` / `prompts`. Those are read-scoped, so
        neither the write kill switch nor any per-tool grant applies to them — the only gate is
        whether the agent declares `mcp_list_resources` / `mcp_read_resource` (and the prompt
        equivalents), which is why they are reported separately from `gates` rather than inside
        it. The counts come from a probe run on the OWNER's authority, so each surface also says
        whether the AGENT can reach what was found: a count without that is true about the server
        and false about what will happen. `-32601` is reported as `unsupported` ("this server has
        none"), never as a failure. Both fields are absent when the connection itself failed —
        an unreachable server taught us nothing about what it publishes.

        The endpoint is user-supplied config, so this request goes out through the same
        SSRF-guarded, https-only path as any other outbound MCP call (no test-only fast path),
        it is rate-limited strictly, and it writes the same redacted `agent_events` row — a test
        is as auditable as a real call rather than a side channel around the log. Nothing in the
        response contains a credential: the endpoint is normalized (query string dropped) and
        server error text is redacted before it is returned.
      operationId: testInstanceMcpConnection
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: An https MCP endpoint, e.g. `https://example.com/mcp`. }
                auth: { type: string, description: '`none` to test an open server without sending the vault credential. Default: send it.' }
      responses:
        "200":
          description: What the connection attempt learned
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint: { type: string, description: The normalized endpoint — the form consent and the trace log key on. }
                  status:
                    type: string
                    enum: [connected, credential_missing, auth_required, unsupported_protocol, unreachable, blocked, permission_denied, invalid_url]
                    description: |
                      `credential_missing` (no token stored) is deliberately distinct from `auth_required`
                      (the server rejected the token we have). There is no `expired`: a server answering
                      401 says nothing about why, so expired, revoked and never-valid are indistinguishable
                      on the wire and naming one would be a guess presented as a diagnosis.
                  detail: { type: string, description: One actionable sentence. On success it states how many of the discovered tools are callable. }
                  failure: { type: string, description: "The connector's failure class, e.g. `auth`, `unsupported_version`, `blocked`, `network`." }
                  era: { type: string, enum: [modern, legacy], description: Which Streamable-HTTP era was negotiated. }
                  protocolVersion: { type: string }
                  httpStatus: { type: integer }
                  durationMs: { type: integer }
                  toolCount: { type: integer, description: Tools the server published. }
                  callableCount: { type: integer, description: How many of them this instance could call right now. }
                  gates:
                    type: object
                    properties:
                      callToolEnabled: { type: boolean, description: The agent declares `mcp_call_tool` and the owner has not switched it off. }
                      writeConsent: { type: boolean, description: "Connector-level write consent for `mcp` — the kill switch." }
                  resources: { $ref: "#/components/schemas/McpSurfaceReport" }
                  prompts: { $ref: "#/components/schemas/McpSurfaceReport" }
                  tools:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        destructive: { type: boolean, description: "Judged on the tool NAME we would send — never the server's own `destructiveHint`, which is authored by the party being defended against." }
                        granted: { type: boolean }
                        callable: { type: boolean }
                        blockedBy: { type: string, enum: [no_grant, wildcard_excludes_destructive, no_write_consent, tool_disabled] }
                  auth:
                    type: object
                    description: The shape of the server's OAuth model when it publishes RFC 9728/8414 metadata. Never a token.
                    properties:
                      protectedResource: { type: boolean }
                      authorizationServer: { type: string }
                      dynamicRegistration: { type: boolean }
                      pkceS256: { type: boolean, description: "Together with `dynamicRegistration`, the precondition for `POST /v1/mcp/oauth/start` — the console offers Connect only when both hold." }
                      unattended: { type: string, description: Whether a credential from this server could survive unattended. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/mcp/presets:
    get:
      summary: First-party MCP servers this deployment knows about
      description: |
        A preset is a PREFILLED URL and nothing more. It carries no credential, grants no tool and
        skips no gate: the endpoint it names goes through the same connection test, the same
        per-(endpoint, tool) consent and the same authorization flow as one the user typed.

        The endpoint is resolved from deployment config (`MCP_SELF_URL`), never from a constant in
        the connector — `lib/connectors/mcp.ts` deliberately contains no server host at all, so
        that a configured MCP server stays user data and PAGS stays self-contained. A deployment
        that names no server returns an empty list, which is the normal state of a local build.

        `smokeTool` names a read-only tool worth trying first. It is advisory: the console offers a
        button, and the call still goes through `mcp_call_tool` and its consent gate.
      operationId: listMcpPresets
      tags: [Tools]
      responses:
        "200":
          description: The presets, possibly none
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        url: { type: string, description: Normalized https MCP endpoint. }
                        scope: { type: string, nullable: true, description: OAuth scope requested at authorization — least privilege, e.g. `read`. }
                        smokeTool: { type: string, nullable: true }
                        description: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/mcp/oauth/start:
    post:
      summary: Begin OAuth authorization for a user-named MCP endpoint
      description: |
        Modern MCP servers are OAuth public clients: PKCE S256, `token_endpoint_auth_method: none`,
        and a client registered at runtime (RFC 7591) because the operator has never heard of the
        server a subscriber just named. There is no token for a human to paste, and those servers'
        own docs say not to ask for one. This starts the flow they implement.

        The response is the provider's authorize URL, for the caller to open in a browser. The
        response ALSO sets an `HttpOnly` nonce cookie that binds the flow to this browser: the
        callback refuses without it, because a signed state alone is bearer-grade (an attacker's
        consent link, completed by a victim, would file the victim's grant under the attacker's
        account).

        Refused, with a reason, for: a server publishing no OAuth metadata (store a token instead);
        one that will not register clients dynamically; one offering no PKCE S256 (a `plain`
        challenge equals its verifier, so there is deliberately no fallback); and metadata whose
        `issuer` is not the server that published it (the RFC 8414 mix-up).

        Discovery, registration and the token exchange all go through the SSRF guard (https-only,
        redirect-revalidated, private/metadata addresses refused) — the endpoint is user config, so
        an authenticated "connect this URL" is otherwise a server-side request forgery primitive.
        Strictly rate-limited for the same reason.

        Authorizing a server is NOT consent to its tools: per-(instance, endpoint, tool) grants are
        untouched, and a freshly authorized server can still call nothing until they are granted.
      operationId: startMcpOauth
      tags: [Tools]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: An https MCP endpoint, e.g. `https://example.com/mcp`. }
                scope: { type: string, maxLength: 200, description: "OAuth scope to request. Omitted = let the server decide; least privilege is preferred (the first-party preset asks for `read`)." }
      responses:
        "200":
          description: The authorize URL to open, plus what discovery learned
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, description: The provider's authorize URL (PKCE S256, RFC 8707 `resource`). }
                  endpoint: { type: string, description: Normalized MCP endpoint the resulting credential will be bound to. }
                  issuer: { type: string }
                  unattended: { type: string, enum: [yes, refresh, interactive-only], description: "`interactive-only` = the server issues no refresh token, so access cannot be renewed with nobody present — do not wire it into a cron trigger or a chain." }
                  expiresIn: { type: integer, description: Seconds this authorization may sit unfinished. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/mcp/oauth/callback:
    get:
      summary: OAuth redirect target that completes an MCP authorization
      description: |
        Unauthenticated by construction — a top-level navigation arriving from a server we do not
        control — so the signed `state` is the only evidence about who to credit. It carries three
        pins, all failing closed: a nonce matching the `HttpOnly` cookie set at start (the browser
        that began the flow), the flow type (`SESSION_SIGNING_KEY` also signs sessions and
        connector states), and the RESOURCE, which must equal the claimed flow's endpoint so a
        state minted for one MCP server can never complete — or write a credential for — another.

        Every parameter of the token exchange comes from the flow row recorded at start time from
        metadata we discovered ourselves; nothing but `code` is read from this request. The row is
        claimed atomically, so a replayed callback loses the race here rather than reaching the
        token endpoint twice.

        Returns an HTML page, not JSON: the browser lands here, not an API client.
      operationId: mcpOauthCallback
      tags: [Tools]
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string }, description: Set when the user declined or the server refused. Nothing is stored. }
      responses:
        "200":
          description: Authorized — the credential is stored for that endpoint
          content:
            text/html:
              schema: { type: string }
        "400":
          description: State could not be verified, the link expired or was replayed, or the token exchange was refused
          content:
            text/html:
              schema: { type: string }

  /v1/instances/{instanceId}/tools/{name}:
    put:
      summary: Turn one tool off (or back on)
      description: |
        The subscriber's veto over their own copy. A creator can only ever GRANT capability,
        so without this the owner has no way to take one away short of unsubscribing.
        Switching a tool off removes it from the chat runtime AND refuses it on the invoke
        route — a control that covered only one surface would not be control. A tool this
        agent never declared is rejected rather than stored.
      operationId: setInstanceTool
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new state
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  enabled: { type: boolean }
                  disabledTools:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The agent does not declare this tool
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown tool, or instance not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Invoke a connector tool
      description: |
        The SAME tools the agent runtime dispatches, callable directly. The body is the tool's
        input, validated against its JSON schema. Owning the instance is not authority to run
        anything on it: the capability gate applies here exactly as it does in chat and over
        MCP, and a write tool additionally needs the per-instance connector consent.
      operationId: callInstanceTool
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The tool result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The gate refused — not declared, disabled by the owner, or no write consent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/connectors/consent:
    get:
      summary: Write consents granted on this instance
      operationId: listConnectorConsents
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Granted consents
          content:
            application/json:
              schema:
                type: object
                properties:
                  consents:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/connectors/{connector}/consent:
    put:
      summary: Grant or revoke a connector's write consent
      description: |
        Reads never need consent; writes always do. Granting is validated against the connector
        registry — an unknown connector is 404 and a read-only one is 400, because consent state
        that looks granted but can never do anything is the raw material for a later bypass.
        Revocation is deliberately NOT validated, so a stale row always stays removable.
      operationId: setConnectorConsent
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: connector, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The consent state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  connector: { type: string }
                  scope: { type: string, example: write }
                  enabled: { type: boolean }
        "400":
          description: The connector is read-only — write access cannot be granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown connector, or instance not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/instances/{instanceId}/connections:
    get:
      summary: Agent-to-agent connections from this instance
      description: |
        Choreography, not orchestration: a connection routes a FACT this instance emits (e.g.
        `lead.created`, `site.live`) into another of your instances by running a trigger action.
        Storage stays isolated, and chain-versus-fan-out stays configuration.
      operationId: listConnections
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Connections whose SOURCE is this instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create an agent-to-agent connection
      description: |
        Verifies you own BOTH instances. `config.filter` uses the same
        `[{field, op, value}]` predicate vocabulary the pipeline `filter` step uses — as a bare
        array (AND) or `{where, any}` (OR) — and is validated at create time, because a filter
        that silently never matches stops the chain while the connection still looks healthy.
      operationId: createConnection
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventType, targetInstanceId, action]
              properties:
                eventType: { type: string, example: lead.created }
                targetInstanceId: { type: string }
                action: { type: string, description: Trigger action to run on the target — same vocabulary as triggers and actionable tickets. }
                config:
                  type: object
                  additionalProperties: true
                  description: "Wiring-owned settings, e.g. `params` merged under the event payload, and `filter`."
      responses:
        "201":
          description: The created connection
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/connections/{cid}:
    delete:
      summary: Delete a connection
      operationId: deleteConnection
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: cid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/connections/deliveries:
    get:
      summary: The delivery outbox
      description: |
        What each connection actually delivered, what is queued for retry, and what died.
        Without this a chain fails invisibly — the emitting agent looks fine and the consuming
        agent simply never ran. Delivery is at-least-once with ~1m/5m/15m/1h/3h backoff over
        five attempts; exhausted attempts become `dead`, which is visible and replayable.
        Account-wide rather than per-connection, because "what is stuck anywhere" is the real
        question; the outbox is shared with triggers, hence `source`.
      operationId: listDeliveries
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, dead] } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        connectionId: { type: string }
                        source: { type: string, enum: [connection, trigger] }
                        sourceInstanceId: { type: string }
                        eventType: { type: string }
                        action: { type: string }
                        targetInstanceId: { type: string }
                        status: { type: string, enum: [pending, delivered, dead] }
                        attempts: { type: integer }
                        nextAttemptAt: { type: string, nullable: true }
                        lastError: { type: string, nullable: true }
                        traceId: { type: string, nullable: true, description: "The emitting run, so parent and child runs can be joined."  }
                        createdAt: { type: string }
                        updatedAt: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/connections/deliveries/{did}/replay:
    post:
      summary: Re-arm a dead delivery
      description: The manual escape hatch for "the dependency is back up now". Only a `dead` delivery can be replayed.
      operationId: replayDelivery
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: did, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Queued for another attempt
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, example: pending }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No dead delivery with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Durable loops, supervision, delegation ────────────────────────────────
  #
  # Summary level: these are recent (#158/#159/#183) and their request bodies may still
  # change. Method, path, auth and semantics are stable enough to publish; do not depend
  # on the exact response fields.

  /v1/instances/{instanceId}/loop:
    post:
      summary: Start a durable agent loop
      description: |
        Puts an autonomous objective on the SERVER rather than in the browser tab, so closing
        the tab no longer kills it. Every server-driven loop gets a spend budget — even an
        unconfigured one, clamped to the account ceiling. What the loop DRIVES follows the
        agent's declared capabilities (a chat loop, or a coding engine), not a hardcoded
        workflow.
      operationId: startLoop
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objective]
              properties:
                objective: { type: string, maxLength: 2000 }
                maxIterations: { type: integer, description: Clamped to the platform ceiling. }
                budget:
                  type: object
                  properties:
                    costMicros: { type: integer }
                    delegations: { type: integer }
                    maxDepth: { type: integer }
      responses:
        "201":
          description: The loop run
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string }
                  driver: { type: string }
                  budgetId: { type: string }
                  maxIterations: { type: integer }
                  status: { type: string, example: running }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      summary: List this instance's loop runs
      operationId: listLoopRuns
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Loop runs, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/loop/{runId}:
    get:
      summary: Read one loop run
      operationId: getLoopRun
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/loop/{runId}/cancel:
    post:
      summary: Cancel a running loop
      description: Cooperative — the flag is read at the top of the next iteration so the in-flight step finishes and its spend settles. A hard kill would strand a budget reservation.
      operationId: cancelLoopRun
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancellation requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  status: { type: string, example: cancelling }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No running loop with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/instances/{instanceId}/loop-presets:
    get:
      summary: Read this instance's loop presets
      description: |
        The one-tap objectives offered wherever a loop starts. Resolution order is the
        subscriber's own list, then the creator template's, then the driver default —
        `source` says which one you are looking at, so a UI can avoid offering to "reset"
        a value nobody ever set. `driver` is what this instance's loop actually drives.
      operationId: getLoopPresets
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      responses:
        "200":
          description: Resolved presets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopPresets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace the subscriber's loop presets
      description: |
        Sends the whole list, not a patch. An EMPTY list CLEARS the override rather than
        storing `[]`, so "remove the last one" and "give me the defaults back" are the same
        gesture and the instance resumes inheriting whatever the creator ships. Max 12
        presets; labels are truncated at 60 characters. Returns the newly resolved set.
      operationId: setLoopPresets
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                presets:
                  type: array
                  maxItems: 12
                  items: { $ref: "#/components/schemas/LoopPreset" }
      responses:
        "200":
          description: Resolved presets after the write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoopPresets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/supervision:
    get:
      summary: Supervision edges from this instance
      description: |
        Who supervises whom, as configured data. Deliberately separate from `/connections`:
        that is choreography (emit a fact, consumers unknown), this is delegation (name a
        subordinate, hand it a goal, own the result). Scoped to the SUPERVISOR.
      operationId: listSupervision
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Supervision links
          content:
            application/json:
              schema:
                type: object
                properties:
                  supervision:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Add a subordinate
      description: >-
        Cycles, towers, excessive fan-out and two-managers are all rejected here, while the human is
        looking at the form — every one of them is otherwise invisible until it has already spent money.
        So is a supervisor whose AGENT declares no supervision tool (#354): the graph is instance-level
        and the ability is agent-level, and an edge the runtime can never use is not worth writing. The
        SUBORDINATE needs nothing declared — being delegated to is not a capability.
      operationId: createSupervision
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subordinateInstanceId]
              properties:
                subordinateInstanceId: { type: string }
                config: { type: object, additionalProperties: true }
      responses:
        "201":
          description: The created link
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/supervision/{sid}:
    delete:
      summary: Remove a supervision link
      operationId: deleteSupervision
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/delegate:
    post:
      summary: Hand a goal to a subordinate
      description: |
        Scoped to the SUPERVISOR. The configured graph decides who may drive whom — delegating
        to an instance that is not your subordinate is a 403, which is what stops the
        supervision graph from being merely advisory. Depth comes from the graph and the budget
        is inherited, so neither can be understated by the caller.
      operationId: delegate
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subordinateInstanceId, objective]
              properties:
                subordinateInstanceId: { type: string }
                objective: { type: string }
                maxIterations: { type: integer }
                budgetId: { type: string, nullable: true }
                parentTraceId: { type: string, nullable: true }
      responses:
        "201":
          description: The subordinate's run
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId: { type: string }
                  budgetId: { type: string }
                  depth: { type: integer }
                  status: { type: string, example: running }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: That instance is not your subordinate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Declarative pipelines ─────────────────────────────────────────────────
  #
  # Summary level: the step vocabulary is evolving (epic #58). A pipeline definition IS
  # data — it lives in the instance's config, not in code.

  /v1/instances/{instanceId}/pipelines:
    get:
      summary: List this instance's pipelines
      operationId: listPipelines
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Pipeline names with step counts and validity
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipelines:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        steps: { type: integer }
                        sink: { type: string, nullable: true, description: Collection the run writes into. }
                        valid: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/pipelines/{name}:
    put:
      summary: Attach (or replace) a pipeline definition
      description: The body IS the pipeline definition, rejected with 400 if it does not validate. Stored config is capped at 256KB.
      operationId: setPipeline
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  name: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Instance config too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/instances/{instanceId}/pipelines/{name}/run:
    post:
      summary: Start a pipeline run
      description: Kicks the durable pipeline workflow and returns the run and workflow ids. Results land in the trace and the sink collection, not inline. Audited with the caller's user id.
      operationId: runPipeline
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                params: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Run started
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  runId: { type: string }
                  workflowId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No pipeline with that name on this instance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/instances/{instanceId}/pipeline-runs:
    get:
      summary: Pipeline run history
      description: Most recent first, with counts and status. Per-record audit rides on each record's `audit` field in the sink collection.
      operationId: listPipelineRuns
      tags: [Tools]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: pipeline, in: query, description: Narrow to one pipeline's history., schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                properties:
                  runs:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Triggers ──────────────────────────────────────────────────────────────

  /v1/triggers:
    get:
      summary: List triggers
      operationId: listTriggers
      tags: [Triggers]
      parameters:
        - { name: instanceId, in: query, description: Narrow to one instance (ownership is checked)., schema: { type: string } }
      responses:
        "200":
          description: Up to 200 triggers, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  triggers:
                    type: array
                    items: { $ref: "#/components/schemas/Trigger" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The instance is not active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      summary: Create a trigger
      description: |
        A `cron` trigger fires on a schedule (with optional jitter); a `webhook` trigger gets a
        high-entropy secret token and a public URL. Both run the same `action` vocabulary that
        connections and actionable tickets use.
      operationId: createTrigger
      tags: [Triggers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instanceId, type]
              properties:
                instanceId: { type: string }
                name: { type: string }
                type: { type: string, enum: [webhook, cron] }
                action: { type: string, default: create_task }
                schedule: { type: string, description: "Cron expression. Required for `cron`, ignored for `webhook`." }
                enabled: { type: boolean, default: true }
                config:
                  type: object
                  additionalProperties: true
                  description: "Wiring-owned settings, e.g. `jitterMinutes`, `params`, `filter`. Unknown keys are dropped by the whitelist parser."
      responses:
        "201":
          description: The created trigger (webhook triggers include `webhookUrl`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger: { $ref: "#/components/schemas/Trigger" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The instance is not active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/triggers/actions:
    get:
      summary: Which trigger actions this instance can actually perform
      description: |
        The whole action vocabulary, annotated for one instance. An action whose executor requires
        a capability the agent does not declare comes back with `available: false` and the reason
        — the same sentence `POST /v1/triggers` refuses it with — so a picker can disable the
        option and say why instead of offering work that can never happen.

        Unavailable actions are returned, not filtered out: the user's question is "why can't I
        schedule this here?", and the answer is the reason on a disabled row.
      operationId: listTriggerActions
      tags: [Triggers]
      parameters:
        - { name: instanceId, in: query, required: true, description: The instance the actions are judged against (ownership is checked)., schema: { type: string } }
      responses:
        "200":
          description: The action vocabulary for this instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string, description: "The action id, e.g. `run_browse`." }
                        label: { type: string, description: Human label for a picker. }
                        available: { type: boolean, description: Can this instance perform it? }
                        reason:
                          type: string
                          nullable: true
                          description: Why not, in the words the save path would use. `null` when available.
                        requires:
                          type: string
                          nullable: true
                          description: The capability the agent must declare, when the action needs one.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The instance is not active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/triggers/preview:
    post:
      summary: Preview a trigger before saving it
      description: |
        Validates a trigger definition and, for a cron trigger, returns the next few fire
        times. Creates nothing. An unrecognised `action` is not an error here — it is
        reported through `issues` rather than a 4xx, because this endpoint exists to tell
        the console what is wrong with a draft.
      operationId: previewTrigger
      tags: [Triggers]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceId:
                  type: string
                  description: |
                    Optional. When given (ownership is checked), an action this agent's
                    capabilities cannot perform is reported through `issues` too — the same
                    class of problem as config that would be stored and then ignored.
                type:
                  type: string
                  enum: [webhook, cron]
                  default: webhook
                  description: Anything other than `cron` is treated as `webhook`.
                action:
                  type: string
                  default: create_task
                  description: The trigger action to validate the config against.
                schedule:
                  type: string
                  description: Cron expression. Only read when `type` is `cron`.
                config:
                  type: object
                  description: The trigger config to validate. `timezone` and `jitterMinutes` are echoed back.
                count:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
                  description: How many upcoming run times to return. Clamped to 1..5.
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  schedule:
                    type: [string, "null"]
                    description: The normalised cron expression, or null for a webhook trigger or an unparseable schedule.
                  timezone: { type: [string, "null"] }
                  jitterMinutes: { type: [number, "null"] }
                  runs:
                    type: array
                    items: { type: string, format: date-time }
                    description: Upcoming fire times. Empty for a webhook trigger or when the schedule failed to parse.
                  issues:
                    type: array
                    items: { type: string }
                    description: Config validation problems. An empty array means the definition is saveable.
                  error:
                    type: [string, "null"]
                    description: Why the schedule could not be parsed, if it could not be.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/triggers/{id}:
    put:
      summary: Update a trigger
      description: Omitted fields keep their current value. `rotateSecret` mints a new webhook token, invalidating the old URL.
      operationId: updateTrigger
      tags: [Triggers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                action: { type: string }
                schedule: { type: string }
                enabled: { type: boolean }
                config: { type: object, additionalProperties: true }
                rotateSecret: { type: boolean }
      responses:
        "200":
          description: The updated trigger
          content:
            application/json:
              schema:
                type: object
                properties:
                  trigger: { $ref: "#/components/schemas/Trigger" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a trigger and its event history
      operationId: deleteTrigger
      tags: [Triggers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/triggers/{id}/events:
    get:
      summary: A trigger's event log
      operationId: listTriggerEvents
      tags: [Triggers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Events, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        trigger_id: { type: string }
                        instance_id: { type: string }
                        type: { type: string }
                        status: { type: string }
                        message: { type: string, nullable: true }
                        payload: { type: string, nullable: true }
                        error: { type: string, nullable: true }
                        created_at: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/triggers/{id}/run:
    post:
      summary: Fire a trigger manually
      description: Dispatches the trigger's action with the request body as the payload. Recorded as a `manual` event.
      operationId: runTrigger
      tags: [Triggers]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Dispatched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/triggers/webhook/{token}:
    post:
      summary: Inbound webhook
      description: |
        **Unauthenticated by design** — the high-entropy `token` in the path IS the credential
        (a capability URL), so treat that URL as a secret and rotate it with
        `PUT /v1/triggers/{id}` and `rotateSecret`. A JSON body is parsed as-is; anything else
        is delivered as `{text: "…"}`. A disabled or unknown token is indistinguishable: both
        return 404.
      operationId: inboundWebhook
      security: []
      tags: [Triggers]
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
          text/plain:
            schema: { type: string }
      responses:
        "202":
          description: Accepted for dispatch
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "404":
          description: No enabled webhook trigger with that token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Runtime relay ─────────────────────────────────────────────────────────

  /v1/relay/{instanceId}/token:
    post:
      summary: Mint a relay token
      description: |
        The runner calls this with its ACCOUNT session before each connect, so the long-lived
        account JWT never travels in a WebSocket URL. The token is short-lived (~10 minutes)
        and scoped to this one instance. This is also the real Pro enforcement point: tokens
        are re-minted on every reconnect, so a lapsed subscription cuts off at the next connect
        with no stale-registration loophole.
      operationId: mintRelayToken
      tags: [Runtime]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: The relay token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/relay/{instanceId}/connect:
    get:
      summary: Runner WebSocket upgrade
      description: |
        **Different credential.** This endpoint accepts ONLY the short-lived relay token from
        `POST /v1/relay/{instanceId}/token`, passed as `?token=` — never the account JWT. That
        is what keeps a leaked relay URL from becoming account or machine takeover. Errors are
        plain-text HTTP, not JSON, because not every WebSocket client surfaces a JSON body.

        The socket is routed to a Durable Object keyed per (instance, node), so several
        machines can serve the same instance concurrently. A second runner on the SAME hostname
        is rejected unless `force=1`.

        Protocol once open: the cloud sends `{id, method, path, body}` and the runner replies
        `{id, status, result}`.
      operationId: relayConnect
      security: []
      tags: [Runtime]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: token, in: query, required: true, description: A relay token. An account session JWT is rejected here., schema: { type: string } }
        - { name: node, in: query, description: "The machine's hostname, so multiple machines can stay connected at once.", schema: { type: string } }
        - { name: force, in: query, description: Send `1` to take over from another runner on the same hostname., schema: { type: string, enum: ["1"] } }
      responses:
        "101": { description: Switching protocols — the WebSocket is open }
        "401": { description: "Missing, expired, or wrong-instance token (plain text)" }
        "404": { description: Instance not found (plain text) }
        "409": { description: Another runner on this hostname holds the socket — retry with `force=1` }

  /v1/relay/{instanceId}/status:
    get:
      summary: Is a runner connected?
      operationId: relayStatus
      tags: [Runtime]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: node, in: query, description: Check one specific machine., schema: { type: string } }
      responses:
        "200":
          description: Connection state, passed through from the relay Durable Object
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  connected: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Terminals ─────────────────────────────────────────────────────────────

  /v1/terminals/nodes:
    get:
      summary: The user's connected CLIs
      description: |
        A platform-level view of every machine running `pags up`, across ALL agents — a node is
        owned by the user, not by any one agent. Agents that never touch a local runner
        (`runtime: null`) are excluded, and so are machines that end up with no runner-using
        agents and no sessions. `connected` is live-checked against the relay sockets, not read
        from a status column (which is not cleared on disconnect).
      operationId: listTerminalNodes
      tags: [Terminals]
      responses:
        "200":
          description: Machines, each with the instances it serves and the coding sessions pinned to it
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                      properties:
                        node: { type: string, description: The machine name (hostname). }
                        placement: { type: string }
                        runnerVersion: { type: string }
                        lastSeenAt: { type: string, nullable: true }
                        connected: { type: boolean }
                        instances:
                          type: array
                          items:
                            type: object
                            properties:
                              instanceId: { type: string }
                              name: { type: string }
                              agentSlug: { type: string, nullable: true }
                              status: { type: string }
                              connected: { type: boolean }
                              bound: { type: boolean, description: "This instance is PINNED to this machine, not merely served by it." }
                              runtime: { type: string, enum: [browser, coding] }
                        sessions:
                          type: array
                          items:
                            type: object
                            properties:
                              sessionId: { type: string }
                              instanceId: { type: string }
                              repoId: { type: string }
                              repoName: { type: string, nullable: true }
                              engine: { type: string }
                              status: { type: string }
                              issueNumber: { type: integer }
                              issueTitle: { type: string }
                              updatedAt: { type: string }
                              terminalTail: { type: string, nullable: true, description: "Last terminal snapshot tail, from the stored timeline — no runner call." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Usage ─────────────────────────────────────────────────────────────────

  /v1/usage:
    get:
      summary: Token and cost usage
      description: |
        Aggregated from the `ai_usage` ledger across all your agents, broken down by model,
        modality (chat, apply, coding, voice, translate) and agent, over time. Cost is a BYOK
        ESTIMATE — tokens multiplied by published list price. The platform never sees the real
        provider bill. History begins when the ledger shipped; there is no backfill.
      operationId: getUsage
      tags: [Usage]
      parameters:
        - { name: range, in: query, description: Anything other than these values means "all time"., schema: { type: string, enum: [7d, 30d, 90d], default: 30d } }
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  range: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Stats ─────────────────────────────────────────────────────────────────

  /v1/stats/sources:
    get:
      summary: The stats source vocabulary
      description: |
        The CLOSED list of sources a stats card may name, with the card kinds each can fill, its
        declared params, and — importantly — its `caveat`: what that number does not count. A card
        names a source and never carries a query, which is what makes an agent-authored card safe.
        Public: a static description of the product with nothing user-specific in it.
      operationId: getStatsSources
      tags: [Stats]
      security: []
      responses:
        "200":
          description: The source table
          content:
            application/json:
              schema:
                type: object
                properties:
                  maxCards: { type: integer }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: collection.group_by }
                        label: { type: string }
                        describes: { type: string }
                        caveat: { type: string, description: What this number does not count. }
                        unit: { type: string, enum: [count, tokens, usd_micros], description: "Unit of this source's scalars AND of its daily series. usd_micros is 1,000,000 = $1." }
                        kinds: { type: array, items: { type: string, enum: [number, line, bar, table] } }
                        families: { type: array, items: { type: string, enum: [trend, point_in_time] } }
                        params: { type: array, items: { type: object, additionalProperties: true } }

  /v1/instances/{instanceId}/stats:
    get:
      summary: Stats cards and their current values
      description: |
        The resolved card set (creator default merged per card under your override) with each
        card's value for ONE page-level window. `line` cards are trends read from the daily
        rollup and carry `unit` plus `points: [{day, value}]` where **`value: null` means nothing
        ran that day — it is not zero**. Everything else is a live aggregate over the window. A card that
        failed carries `error` instead of `data`, so "broken" stays distinguishable from "empty".
        `historyStart` is the first day the rollup has for this instance (there is no backfill);
        `throughDay` is the last completed UTC day, which is where every trend series ends.
      operationId: getInstanceStats
      tags: [Stats]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: window, in: query, description: Anything outside the enum falls back to 30; the response echoes what was used., schema: { type: string, enum: ["7", "30", "90"], default: "30" } }
      responses:
        "200":
          description: Cards with values
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  window: { type: integer }
                  throughDay: { type: string, format: date }
                  historyStart: { type: string, format: date, nullable: true }
                  cards:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        id: { type: string }
                        title: { type: string }
                        kind: { type: string, enum: [number, line, bar, table] }
                        source: { type: string }
                        family: { type: string, enum: [trend, point_in_time] }
                        caveat: { type: string }
                        data: { type: object, additionalProperties: true, nullable: true }
                        error: { type: string, description: Present INSTEAD of data when this one card failed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Replace your stats-card override
      description: |
        Whole-object write of the subscriber layer — `{cards, hidden}`. `hidden` lists card ids
        inherited from the agent template that you do not want to see; a subscriber cannot delete
        a creator's card, only hide their own copy. Cards that fail validation come back in
        `rejected` BY NAME rather than being silently dropped.
      operationId: putInstanceStats
      tags: [Stats]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cards: { type: array, items: { type: object, additionalProperties: true } }
                hidden: { type: array, items: { type: string } }
      responses:
        "200":
          description: The resolved card set after the write, plus anything refused
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/stats/schema:
    get:
      summary: Stats cards without running any query
      description: The resolved cards, the creator's default set, and your own override layer — what a config UI edits. No aggregates are executed.
      operationId: getInstanceStatsSchema
      tags: [Stats]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      responses:
        "200":
          description: Cards, template default, and override
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/stats/cards:
    post:
      summary: Patch individual stats cards
      description: |
        Patch semantics over your own override: `ops: [{id, card}]`, where `card: null` removes
        the card (hiding it, if it was inherited from the agent template). Ops that validate are
        applied even when others are refused, and the refusals come back in `rejected` with the
        reason — a half-applied patch reporting success teaches the caller it changed something
        it did not. This is the same path the agent's own `set_stats_card` tool takes.
      operationId: patchInstanceStatsCards
      tags: [Stats]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ops:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string }
                      card: { type: object, additionalProperties: true, nullable: true }
      responses:
        "200":
          description: The resolved card set after the patch, plus anything refused
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/stats-schema:
    get:
      summary: Read the agent's default stats cards
      description: The card set every subscriber inherits. Owner (or admin) only. Accepts an id or a slug.
      operationId: getAgentStatsSchema
      tags: [Stats]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      responses:
        "200":
          description: The declared cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Declare the agent's default stats cards
      description: |
        Whole-object write, validated and capped at 12 cards. There is deliberately no path by
        which an agent's own tools can reach this: a subscriber's agent editing the template
        would change what every other subscriber gets.
      operationId: setAgentStatsSchema
      tags: [Stats]
      parameters:
        - $ref: "#/components/parameters/AgentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cards: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        "200":
          description: The stored cards, plus anything refused
          content:
            application/json:
              schema:
                type: object
                properties:
                  cards: { type: array, items: { type: object, additionalProperties: true } }
                  rejected: { type: array, items: { type: object, additionalProperties: true } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Errors ────────────────────────────────────────────────────────────────

  /v1/errors:
    get:
      summary: Read the durable error log
      description: Your recent errors. `scope=all` returns everyone's — for admins only, and silently scoped back to just you otherwise.
      operationId: listErrors
      tags: [Errors]
      parameters:
        - { name: scope, in: query, schema: { type: string, enum: [all] } }
        - { name: source, in: query, description: "Filter by source, e.g. `auth`, `keys-proxy`, `client:voice`.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
      responses:
        "200":
          description: Errors, most recent first
          content:
            application/json:
              schema:
                type: object
                properties:
                  scope: { type: string, enum: [me, all] }
                  count: { type: integer }
                  errors:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/errors/client:
    post:
      summary: Report a client-side failure
      description: |
        The browser is otherwise invisible server-side. The source is stored prefixed with
        `client:` so it is distinguishable from server hotspots. Rate-limited hard (10/min).
      operationId: reportClientError
      tags: [Errors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                source: { type: string, default: app, description: "Stored as `client:<source>`, truncated to 64 chars." }
                status: { type: integer }
                context: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Logged
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Push ──────────────────────────────────────────────────────────────────

  /v1/push/vapid-key:
    get:
      summary: Public VAPID key
      description: What the browser needs to create a push subscription. `null` when Web Push is not configured on this deployment.
      operationId: getVapidKey
      tags: [Push]
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/push/subscribe:
    post:
      summary: Register a push subscription
      description: |
        The endpoint is SSRF-guarded — the worker later fetches it, so it must be a public
        https URL on port 443 with a dotted hostname (no IP literals, no `.local`/`.internal`).
        The keys are checked for the right decoded length (65-byte P-256 point, 16-byte auth
        secret). At most 20 subscriptions per user are kept; older ones are pruned.
      operationId: subscribePush
      tags: [Push]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint: { type: string, format: uri, maxLength: 2048 }
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh: { type: string, description: "base64url, decodes to 65 bytes." }
                    auth: { type: string, description: "base64url, decodes to 16 bytes." }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      summary: Remove a push subscription
      description: On unsubscribe or sign-out. Idempotent — an unknown endpoint still returns success.
      operationId: unsubscribePush
      tags: [Push]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string, format: uri }
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Success" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/push/test:
    post:
      summary: Send a test push
      description: Delivers to every device you have registered, for setup validation. Returns how many were actually delivered (0 when Web Push is not configured).
      operationId: testPush
      tags: [Push]
      responses:
        "200":
          description: Delivery count
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Profile and preferences ───────────────────────────────────────────────

  /v1/profile:
    get:
      summary: Read the candidate profile
      description: |
        Structured, reusable personal data — name, phone, city, country, links, work
        authorisation, salary expectation — plus Job Preferences (target roles and locations,
        work type, relocation) stored in the profile's `custom` JSON. The apply agent is
        hard-locked to use these values or ask; it must never invent one. `fields` is the field
        schema, so a UI can render without hardcoding it.
      operationId: getProfile
      tags: [Profile]
      responses:
        "200":
          description: Profile and schema
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile: { type: object, additionalProperties: { type: string } }
                  fields:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Update profile fields
      description: A string value sets the field; `""` or `null` clears it. Non-string values are ignored.
      operationId: setProfile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: string, nullable: true }
      responses:
        "200":
          description: The stored profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  profile: { type: object, additionalProperties: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/preferences:
    get:
      summary: Read account-wide voice and translation defaults
      description: |
        How YOU speak, hear and read, across every agent — neither is a property of an agent.
        A single agent can still differ via its per-instance voice or translation override.
        The supported language list rides along, because the Preferences page has no instance
        to ask.
      operationId: getPreferences
      tags: [Preferences]
      responses:
        "200":
          description: Account preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: object
                    properties:
                      voice: { $ref: "#/components/schemas/VoiceSettings" }
                      translation: { $ref: "#/components/schemas/TranslationConfig" }
                  languages:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      summary: Save account defaults
      description: |
        Patch semantics at the SECTION level — omitting `voice` leaves the stored voice
        preferences alone, so the page can save Translation without round-tripping Voice and
        racing another tab. Within a section it is a whole-object write, sanitised against the
        CURRENT stored value so a partial save cannot silently reset what it did not mention.
        Unknown voice fields are rejected.
      operationId: setPreferences
      tags: [Preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                voice: { $ref: "#/components/schemas/VoiceSettings" }
                translation: { $ref: "#/components/schemas/TranslationConfig" }
      responses:
        "200":
          description: The stored preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    type: object
                    properties:
                      voice: { $ref: "#/components/schemas/VoiceSettings" }
                      translation: { $ref: "#/components/schemas/TranslationConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ── Keys ──────────────────────────────────────────────────────────────────

  /v1/keys/{provider}/verify:
    post:
      summary: Verify a stored provider key
      description: |
        Makes a minimal real request with the stored credential. Currently only `cloudflare` is
        verifiable; anything else is a 400. A provider-side rejection comes back as `ok:false`
        with the upstream status, not as a 5xx.
      operationId: verifyKey
      tags: [Keys]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [cloudflare] } }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  provider: { type: string }
                  checkedAt: { type: string, format: date-time }
        "400":
          description: Verification is not available for this provider, or the provider rejected the key
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                  upstreamStatus: { type: integer }
                  details: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/keys/{provider}/reveal:
    get:
      summary: Reveal a decrypted key to the browser
      description: |
        Deliberately narrow. Only providers with a genuine browser-direct transport that the
        key proxy cannot serve are revealable — today that is **`openai` alone**, for the
        Realtime WebSocket. Every other provider is server-side only and returns 403 with a
        pointer to `/v1/keys/proxy/…`, which injects the credential instead. Rate-limited hard
        (10/min), and never exposed over MCP.
      operationId: revealKey
      tags: [Keys]
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [openai] } }
      responses:
        "200":
          description: The decrypted key
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
        "400":
          description: Unknown provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: This provider's key is server-side only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No key stored for this provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limited
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Batch and agent builder ───────────────────────────────────────────────

  /v1/batch/bulk-visibility:
    post:
      summary: Bulk-change agent visibility
      description: |
        Ownership is checked for every id. Publishing additionally runs the smoke-test guard on
        each agent and refuses the WHOLE batch if any is blocked — a bulk publish that silently
        skipped some ids would leave the caller believing all of them shipped.
      operationId: bulkVisibility
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentIds, visibility]
              properties:
                agentIds:
                  type: array
                  items: { type: string }
                visibility: { type: string, enum: [draft, published, unlisted] }
                allowTestAgent: { type: boolean, description: Override the smoke-test publish guard. }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  updated: { type: integer }
                  visibility: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You do not own one or more of these agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/batch/bulk-delete:
    post:
      summary: Bulk-delete agents
      description: Also removes their executions, usage rows and version snapshots. Ownership is checked for every id.
      operationId: bulkDelete
      tags: [Batch]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentIds]
              properties:
                agentIds:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  deleted: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: You do not own one or more of these agents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agent-builder/plan:
    post:
      summary: Plan an agent from a prompt
      description: Returns a plan describing the agent to create. Creator role required. Nothing is written — review the plan, then post it to `/execute`.
      operationId: planAgent
      tags: [Agent Builder]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: { type: string }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Creator role required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agent-builder/execute:
    post:
      summary: Execute an agent-builder plan
      description: |
        Creator role required. `action` must be `create_agent` (a catalog agent in the
        platform) or `scaffold_agent` (a standalone worker repo). The slug must start with a
        lowercase letter and contain only lowercase letters, digits and hyphens; `template`,
        when given, must be `worker`, `cron` or `api`.
      operationId: executeAgentPlan
      tags: [Agent Builder]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan:
                  type: object
                  required: [action, agent]
                  properties:
                    action: { type: string, enum: [create_agent, scaffold_agent] }
                    template: { type: string, enum: [worker, cron, api] }
                    agent:
                      type: object
                      required: [slug, name]
                      properties:
                        slug: { type: string, pattern: "^[a-z][a-z0-9-]*$" }
                        name: { type: string }
      responses:
        "201":
          description: The result of executing the plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Creator role required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ── Billing ───────────────────────────────────────────────────────────────

  /v1/billing/checkout:
    post:
      summary: Start a Stripe Checkout
      description: |
        Returns the redirect URL for the Pro subscription. **Dormant in production** — PAGS
        billing is deferred, so `STRIPE_PRICE_ID` is unset and this returns 503.
      operationId: startCheckout
      tags: [Billing]
      responses:
        "200":
          description: The Checkout URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/billing/portal:
    post:
      summary: Open the Stripe Customer Portal
      description: Manage or cancel the subscription. Dormant in production alongside checkout.
      operationId: openBillingPortal
      tags: [Billing]
      responses:
        "200":
          description: The portal URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
        "400":
          description: No billing account yet — upgrade first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/billing/webhook:
    post:
      summary: Stripe webhook
      description: |
        **No Bearer auth** — authenticated by the `Stripe-Signature` header instead. Keeps the
        user's subscription columns in sync. The raw request body is required for signature
        verification.
      operationId: stripeWebhook
      security: []
      tags: [Billing]
      parameters:
        - { name: Stripe-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Received
          content:
            application/json:
              schema: { type: object, properties: { received: { type: boolean } } }
        "400":
          description: Invalid payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Unavailable" }

  # ── Instances: remaining chat + knowledge routes ──────────────────────────

  /v1/instances/{instanceId}/system-message:
    post:
      summary: Append a system/status message to the chat
      description: Persists a status line into the instance's chat history — how the console records out-of-band events in the transcript.
      operationId: postSystemMessage
      tags: [Instances]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: Appended
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/loop-decide:
    post:
      summary: One loop-orchestrator decision
      description: |
        The owner's BYOK Claude reads the objective and recent messages and decides whether to
        continue, finish, escalate or fail — and what to say next. Shared with the durable
        `AgentLoopWorkflow`, so a browser-driven loop and a server-driven one cannot disagree
        about when a run is done. Rate-limited to 10/min. A missing BYOK key is a clear 402
        rather than a silent "escalate".
      operationId: loopDecide
      tags: [Tools]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objective, messages, iteration, maxIterations]
              properties:
                objective: { type: string, maxLength: 2000 }
                messages:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    properties:
                      role: { type: string }
                      content: { type: string }
                iteration: { type: integer }
                maxIterations: { type: integer }
      responses:
        "200":
          description: The decision
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  decision: { type: string, enum: [continue, done, escalate, failed] }
                  message: { type: string, description: "The next instruction, when continuing." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402": { $ref: "#/components/responses/PaymentRequired" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ── Agent-scoped storage (creator side) ───────────────────────────────────
  #
  # The template-agent mirror of the instance storage routes: a creator seeds a template's
  # collections, files and vectors, and subscribing copies them into the new instance.
  # Same Durable Object surface, so the same open-object response contract applies.

  /v1/agents/{id}/collections:
    get:
      summary: List an agent template's collections
      operationId: listAgentCollections
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create a collection on an agent template
      operationId: createAgentCollection
      tags: [Storage]
      parameters: [{ $ref: "#/components/parameters/AgentId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/collections/{name}:
    get:
      summary: Read a collection's schema
      operationId: getAgentCollection
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete a collection and its records
      operationId: deleteAgentCollection
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/collections/{name}/records:
    get:
      summary: Query an agent template's records
      operationId: queryAgentRecords
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Insert a record on an agent template
      operationId: insertAgentRecord
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/collections/{name}/records/{recordId}:
    get:
      summary: Read one template record
      operationId: getAgentRecord
      tags: [Storage]
      parameters:
        - { $ref: "#/components/parameters/AgentId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: recordId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/OkObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Update one template record
      operationId: updateAgentRecord
      tags: [Storage]
