      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                  pattern: "^[a-z0-9-]+$"
                  description: Slug for the cloned agent
      responses:
        "201":
          description: Clone created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  slug:
                    type: string
                  clonedFrom:
                    type: string
                    format: uuid
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Source agent not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Chat ──────────────────────────────────────────────────────────────────

  /v1/agents/{id}/chat:
    post:
      summary: Send message to agent
      description: Send a chat message to the template agent's Durable Object. Tracks usage.
      operationId: chatWithAgent
      tags: [Chat]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent UUID or slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "400":
          description: message required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents/{id}/ws-token:
    post:
      summary: Mint a chat WebSocket token
      description: |
        Call this with your ACCOUNT session in the `Authorization` header — where a 30-day
        credential belongs — and get back the short-lived token that `GET /v1/agents/{id}/ws`
        accepts. The token is scoped to this one agent and expires in minutes, so a leaked
        WebSocket URL is worth one agent's chat for minutes rather than the whole account
        for a month.

        This route, not `/ws`, is where authorization is decided: ownership (or admin) and
        the account-suspension gate are checked here. Mint a fresh token on every connect
        and reconnect.
      operationId: mintAgentChatToken
      tags: [Chat]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent UUID or slug
      responses:
        "200":
          description: The chat token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/agents/{id}/ws:
    get:
      summary: WebSocket chat connection
      description: |
        Upgrade to a WebSocket connection for real-time chat with the agent's Durable Object.
        Must send `Upgrade: websocket` header.

        **Different credential.** This endpoint accepts ONLY the short-lived, agent-scoped
        token from `POST /v1/agents/{id}/ws-token`, passed as `?token=` — never the account
        session JWT, which is refused here with a 401. The browser `WebSocket` constructor
        takes no headers, so something has to ride in the URL, and a URL is the least private
        part of a request (history, `Referer`, proxy and CDN access logs, error reporters).
        Same reasoning, and same shape, as the runner's `/v1/relay/{instanceId}/connect`.

        Errors are plain-text HTTP, not JSON, because not every WebSocket client surfaces a
        JSON body.
      operationId: agentWebSocket
      tags: [Chat]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent UUID or slug
        - name: token
          in: query
          required: true
          description: A chat token from `POST /v1/agents/{id}/ws-token`. An account session JWT is rejected here.
          schema:
            type: string
        - name: Upgrade
          in: header
          required: true
          schema:
            type: string
            enum: [websocket]
      responses:
        "101":
          description: WebSocket upgrade successful
        "401":
          description: "Missing, expired, or non-chat token — including an account session JWT (plain text)"
        "403":
          description: Token names another agent, ownership changed, or the account is suspended (plain text)
        "404":
          description: Agent not found (plain text)
        "426":
          description: WebSocket upgrade required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents/{id}/messages:
    get:
      summary: Get message history
      description: Retrieve the agent's conversation history from its Durable Object.
      operationId: getAgentMessages
      tags: [Chat]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
