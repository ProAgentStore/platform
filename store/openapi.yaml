            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentState"
      responses:
        "200":
          description: State updated
          content:
            application/json:
              schema:
                type: object

  /v1/agents/{id}/knowledge:
    get:
