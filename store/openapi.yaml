      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                icon:
                  type: string
                icon_bg:
                  type: string
                model:
                  type: string
                visibility:
                  type: string
                  enum: [draft, published]
                cron_schedule:
                  type: string
