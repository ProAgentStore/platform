                  id:
                    type: string
                    format: uuid
                  version:
                    type: integer
        "403":
          description: Not your agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents/{id}/versions/{versionId}/rollback:
    post:
      summary: Rollback to version
      description: Restore the agent's Durable Object state to a previous snapshot.
      operationId: rollbackAgentVersion
      tags: [Versions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rolled back successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rolledBackTo:
                    type: string
                    format: uuid
        "403":
          description: Not your agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Agent or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Export / Import ───────────────────────────────────────────────────────

  /v1/agents/{id}/export:
    get:
      summary: Export agent backup
      description: Download a full JSON backup of the agent's config, DO state, knowledge base, and memory.
      operationId: exportAgent
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent backup
          content:
            application/json:
              schema:
                type: object
                properties:
                  exportVersion:
                    type: integer
                    example: 1
                  exportedAt:
                    type: string
                    format: date-time
                  agent:
                    type: object
                    properties:
                      slug:
                        type: string
                      name:
                        type: string
                      description:
                        type: string
                      category:
                        type: string
                      storeType:
                        type: string
                      model:
                        type: string
                  state:
                    $ref: "#/components/schemas/AgentState"
                  knowledge:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeDocument"
                  memory:
                    type: array
                    items:
                      type: object
        "403":
          description: Not your agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents/{id}/import:
    post:
      summary: Import agent backup
      description: Restore an agent from a JSON backup. Overwrites current state, knowledge, and memory.
      operationId: importAgent
      tags: [Export]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exportVersion:
                  type: integer
                agent:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    category:
                      type: string
                    model:
                      type: string
                state:
                  $ref: "#/components/schemas/AgentState"
                knowledge:
                  type: array
                  items:
                    $ref: "#/components/schemas/KnowledgeDocument"
                memory:
                  type: array
                  items:
                    type: object
                    required: [key, type, content]
                    properties:
                      key:
                        type: string
                      type:
                        type: string
                      content:
                        type: string
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  restored:
                    type: object
                    properties:
                      knowledge:
                        type: integer
                      memory:
                        type: integer
                      state:
                        type: boolean
        "403":
          description: Not your agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Instances ─────────────────────────────────────────────────────────────

  /v1/instances/{agentId}/subscribe:
    post:
      summary: Subscribe to agent
      description: |
        Subscribe to a published agent. Creates a personal instance with its own
        Durable Object pre-seeded from the template agent's state and knowledge base.
        Also creates a subscription record and notifies the creator.
      operationId: subscribeToAgent
      tags: [Instances]
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
          description: Agent UUID or slug
      responses:
        "201":
          description: Instance created
          content:
            application/json:
              schema:
                type: object
                properties:
                  instanceId:
                    type: string
                    format: uuid
                  agentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: active
        "404":
          description: Agent not found or not published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already subscribed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/my/instances:
    get:
      summary: List my instances
      description: List all agent instances the authenticated user is subscribed to.
      operationId: listMyInstances
      tags: [Instances]
      responses:
        "200":
          description: Subscribed instances
          content:
            application/json:
              schema:
                type: object
                properties:
                  instances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Instance"

  /v1/instances/{instanceId}/chat:
    post:
      summary: Chat with my instance
      description: Send a message to the user's personal instance Durable Object.
      operationId: chatWithInstance
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        "200":
          description: Agent reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
        "400":
          description: message required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/messages:
    get:
      summary: Get instance messages
      operationId: getInstanceMessages
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Clear the chat
      description: |
        Deletes messages, conversation summaries, extracted facts and message vectors in the
        Durable Object, and — best-effort, after the clear — the corresponding voice recordings
        in R2. The deletion is keyed off the returned audio keys, not an R2 prefix sweep: the
        Coder Co-pilot's recordings share the same prefix, and a prefix delete would destroy
        them while their timeline rows survived.
      operationId: clearInstanceMessages
      tags: [Instances]
      parameters: [{ $ref: "#/components/parameters/InstanceId" }]
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  audioKeys:
                    type: array
                    description: The voice recordings that were removed alongside the transcripts.
                    items: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/messages/{messageId}:
    delete:
      summary: Delete one turn
      description: |
        Deletes the EXCHANGE containing this message — the user's message, the agent's reply and
        the tool-log system message written with it — not the single line pointed at. An assistant
        or tool message resolves back to the ask it answered; the span ends at the next user
        message. The voice recording (`audioKey`) and the live dictation stored on each message go
        with them, so a transcript and its audio have one retention rule whether you clear the
        whole conversation or a single turn.

        Deleting a turn does NOT undo what the turn did. Tool calls, memory writes, tickets and
        runs it started all persist, and conversation summaries already computed over it are
        aggregates that cannot be un-mixed. The deleted turn is absent from the model's context on
        the next request, which is the point: a noise message stops shaping later replies.
      operationId: deleteInstanceTurn
      tags: [Instances]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - name: messageId
          in: path
          required: true
          description: Any message in the turn — the user's, the reply, or the tool log.
          schema: { type: string }
      responses:
        "200":
          description: Turn deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                    description: How many messages the turn contained.
                  ids:
                    type: array
                    description: The message ids actually removed — the server's span, not the caller's guess.
                    items: { type: string }
                  audioKeys:
                    type: array
                    description: The voice recordings removed alongside the transcripts.
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No message with that id in this instance's log (or the instance is not yours).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/knowledge:
    get:
      summary: Get instance knowledge base
      operationId: getInstanceKnowledge
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Knowledge documents
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: "#/components/schemas/KnowledgeDocument"
    post:
      summary: Add document to instance knowledge base
      operationId: addInstanceKnowledge
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeDocument"
      responses:
        "201":
          description: Document added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/knowledge/{docId}:
    get:
      summary: Read one knowledge document
      description: The full content, for the console viewer and editor.
      operationId: getInstanceKnowledgeDoc
      tags: [Instances]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: docId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      summary: Edit a knowledge document
      description: Re-vectorizes the document after the edit.
      operationId: updateInstanceKnowledgeDoc
      tags: [Instances]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: docId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                content: { type: string }
      responses:
        "200":
          description: The updated document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KnowledgeDocument" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      summary: Delete document from instance knowledge base
      operationId: deleteInstanceKnowledge
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: docId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/knowledge/ingest-url:
    post:
      summary: Ingest URL into instance knowledge base
      operationId: ingestInstanceKnowledgeUrl
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  format: uri
                title:
                  type: string
      responses:
        "201":
          description: URL ingested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeDocument"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/cancel:
    post:
      summary: Cancel subscription
      description: Deactivate the instance and mark the subscription as canceled.
      operationId: cancelInstance
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subscription canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/runtime:
    post:
      summary: Register ProAgentStore browser runtime
      description: |
        Register or update the ProAgentStore browser runtime endpoint used by
        this PAGS instance. PAGS remains the control plane and stores the runtime
        token without exposing it in responses.
      operationId: registerInstanceRuntime
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpointUrl]
              properties:
                endpointUrl:
                  type: string
                  format: uri
                  description: HTTPS URL for managed runtimes, or localhost HTTP for development.
                token:
                  type: string
                  description: Bearer token configured on the ProAgentStore runtime.
                placement:
                  type: string
                  enum: [local, managed]
                  default: local
                capabilities:
                  type: array
                  items:
                    type: string
                  example: [browser.playwright, file.upload, human.approval]
                runnerVersion:
                  type: string
      responses:
        "201":
          description: Runtime registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    $ref: "#/components/schemas/InstanceRuntime"
        "400":
          description: Invalid runtime registration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Get registered ProAgentStore browser runtime
      operationId: getInstanceRuntime
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runtime registration, or null when no runtime is registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    anyOf:
                      - $ref: "#/components/schemas/InstanceRuntime"
                      - type: "null"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove registered ProAgentStore browser runtime
      operationId: deleteInstanceRuntime
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runtime removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"
        "404":
          description: Instance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/runtime/heartbeat:
    post:
      summary: Mark ProAgentStore browser runtime online
      operationId: heartbeatInstanceRuntime
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runtime marked online
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    example: online
        "404":
          description: Instance or runtime not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/runtime/status:
    get:
      summary: Probe ProAgentStore browser runtime status
      description: Calls the registered runtime's `/health` and `/capabilities` endpoints through PAGS.
      operationId: getInstanceRuntimeStatus
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Runtime is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    $ref: "#/components/schemas/InstanceRuntime"
                  health:
                    type: object
                    additionalProperties: true
                  capabilities:
                    type: object
                    additionalProperties: true
        "502":
          description: Registered runtime could not be reached
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtime:
                    $ref: "#/components/schemas/InstanceRuntime"
                  error:
                    type: string
        "404":
          description: Instance or runtime not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/tasks:
    get:
      summary: List ProAgentStore runtime tasks
      operationId: listInstanceRuntimeTasks
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tasks from the registered ProAgentStore runtime
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/RuntimeSetupTask"
        "404":
          description: Instance or runtime not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create ProAgentStore runtime task
      description: |
        Create a browser/file task on the registered ProAgentStore runtime. PAGS forces
        human approval for sensitive task types such as `browser.open`. Workflow-driven
        tasks such as `job.apply_agent` are driven by their durable workflow brain.
      operationId: createInstanceRuntimeTask
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  example: browser.open
                input:
                  type: object
                  additionalProperties: true
                requiresApproval:
                  type: boolean
                approvalPrompt:
                  type: string
      responses:
        "202":
          description: Task accepted by ProAgentStore runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSetupTask"
        "400":
          description: Invalid task request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Instance or runtime not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/tasks/{taskId}:
    get:
      summary: Get ProAgentStore runtime task
      operationId: getInstanceRuntimeTask
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task from the registered ProAgentStore runtime
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSetupTask"
        "404":
          description: Instance, runtime, or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a ticket
      description: |
        Best-effort cancels the task on the LIVE machine, then drops it from the board.
        Deliberately routed to the connected node rather than the default registration row,
        which is not cleared on disconnect — otherwise the cancel could be posted at a machine
        that is gone while the task kept running on the one actually connected, and the board
        would hide it anyway.
      operationId: deleteInstanceRuntimeTask
      tags: [Board]
      parameters:
        - { $ref: "#/components/parameters/InstanceId" }
        - { name: taskId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/instances/{instanceId}/tasks/{taskId}/approve:
    post:
      summary: Approve ProAgentStore runtime task
      operationId: approveInstanceRuntimeTask
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approved task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSetupTask"
        "404":
          description: Instance, runtime, or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/tasks/{taskId}/cancel:
    post:
      summary: Cancel ProAgentStore runtime task
      operationId: cancelInstanceRuntimeTask
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeSetupTask"
        "404":
          description: Instance, runtime, or task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/instances/{instanceId}/task-events:
    get:
      summary: List ProAgentStore runtime task events
      operationId: listInstanceRuntimeTaskEvents
      tags: [Instances]
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Recent runtime task events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        "404":
          description: Instance or runtime not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Keys ──────────────────────────────────────────────────────────────────

  /v1/keys/providers:
    get:
      summary: List supported AI providers
      description: Returns all AI providers supported by the key vault and proxy (public).
      operationId: listProviders
      security: []
      tags: [Keys]
      responses:
        "200":
          description: Provider list
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Provider"

  /v1/keys/status:
    get:
      summary: Get my key status
      description: Shows which providers the authenticated user has stored keys for.
      operationId: getKeyStatus
      tags: [Keys]
      responses:
        "200":
          description: Key status per provider
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        hasKey:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                          nullable: true
                        lastUsedAt:
                          type: string
                          format: date-time
                          nullable: true

  /v1/keys/{provider}:
    put:
      summary: Store API key
      description: Encrypt and store an API key for the given provider. Cloudflare Workers AI also requires accountId so inference bills to the user's Cloudflare account.
      operationId: storeKey
      tags: [Keys]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [openai, anthropic, google, openrouter, groq, together, cloudflare]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: The raw API key or token (stored encrypted with AES-256-GCM)
                accountId:
                  type: string
                  description: Required for provider=cloudflare. Cloudflare account ID used for Workers AI billing.
      responses:
        "200":
          description: Key stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  provider:
                    type: string
        "400":
          description: Unknown provider or invalid key format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete API key
      description: Remove the stored key for a provider.
      operationId: deleteKey
      tags: [Keys]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Success"

  /v1/keys/proxy/{host}/{path}:
    post:
      summary: Proxy AI API call
      description: |
        Inject the user's stored key and forward the request to an upstream AI provider.
        The `host` segment identifies the provider (e.g. `api.openai.com`).
        Everything after the host becomes the upstream path.

        Example: `POST /v1/keys/proxy/api.openai.com/v1/chat/completions`

        Rate limit: 100 calls/hour per user.
      operationId: proxyAiCall
      tags: [Keys]
      parameters:
        - name: host
          in: path
          required: true
          schema:
            type: string
          example: api.openai.com
          description: Upstream AI API host
        - name: path
          in: path
          required: true
          schema:
            type: string
          example: v1/chat/completions
          description: Path on the upstream API
      requestBody:
        description: Request body forwarded verbatim to the upstream API
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Upstream API response forwarded
        "400":
          description: Unsupported host or no key stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded (100 calls/hour)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

