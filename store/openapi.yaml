        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents:
    get:
      summary: List published agents
      description: Browse published agents in the store. Filterable by category and sortable.
      operationId: listAgents
      security: []
      tags: [Agents]
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category slug
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, popular, name]
            default: newest
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Published agents
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/AgentSummary"
    post:
      summary: Create agent
      description: Create a new agent. Requires the `creator` role. The agent is created as a draft.
      operationId: createAgent
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name]
              properties:
                slug:
                  type: string
                  pattern: "^[a-z0-9-]+$"
                  description: Unique URL-safe identifier
                name:
                  type: string
                description:
                  type: string
                category:
                  type: string
                  default: general
                icon:
                  type: string
                icon_bg:
                  type: string
                  example: "#7c3aed"
                model:
                  type: string
                  example: "@cf/meta/llama-3.2-3b-instruct"
                personality:
                  type: string
                  description: Initial personality prompt stored in the Durable Object
                goal:
                  type: string
                  description: Initial goal prompt stored in the Durable Object
      responses:
        "201":
          description: Agent created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  slug:
                    type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Slug already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/agents/{id}:
    get:
      summary: Get agent
      description: |
        Get a single agent by ID or slug. Published agents are public.
        Draft agents are only visible to the owner or admins.
      operationId: getAgent
      security: []
      tags: [Agents]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
