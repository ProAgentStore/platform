name: Deploy API Worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/api/**'
      - 'packages/sdk/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-api
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `pnpm test` below now includes migration-hygiene.test.ts, which shells out to
          # check-migrations.mjs --require-history. That guard REFUSES a shallow clone by
          # design: a history-dependent check with no history passes by verifying nothing,
          # so it fails loudly instead. Depth 1 therefore red-lined this deploy from the
          # commit the guard landed in (48eb443) — the API fixes were merged and undeployed
          # while Deploy Host stayed green, so the console looked fine and the worker was stale.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm test` runs the WHOLE suite, including the console + agent UIs, which import
      # @proagentstore/sdk through its exports map — i.e. its built dist. Without this the suite
      # green in CI (which does build it) fails here on an unresolvable bare specifier, blocking a
      # deploy for a reason unrelated to the change. Same step, same reason, as in ci.yml.
      - name: Build SDK
        run: cd packages/sdk && npx tsc

      - name: Run tests
        run: pnpm test

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: d1 migrations apply pags --remote

      - name: Deploy API worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.proagentstore.online/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying..."
            sleep 5
          done
          echo "Health check failed after 5 attempts"
          exit 1
