name: Publish MCP Registry

# Deliberately NOT triggered by `workers/mcp/**` (#573, AC5).
#
# This workflow publishes `server.json` — name, title, description, version, repository and
# the remote endpoint. It does NOT publish the tool list: the registry entry is a POINTER to
# https://mcp.proagentstore.online/mcp, so a change to the tool surface changes nothing in
# the manifest except, when it is a surface change, the version.
#
# And that version cannot move without `server.json` moving. `MCP_SERVER_VERSION`
# (`workers/mcp/src/server-version.ts`) is the one source; `scripts/docs-drift.mjs`'s
# wire-surface check fails when `server.json` disagrees with it, and docs-drift is a required
# CI gate. So "the advertised version bumped" and "server.json changed in this push" are the
# same event, and the existing path already fires on it.
#
# Widening to `workers/mcp/**` would run `mcp-publisher publish` on every worker commit with
# an unchanged version — a job that no-ops or fails on nearly every push, which is how a
# workflow stops being read.
#
# ── It no longer triggers on ITSELF, and it checks before it publishes (#573)
#
# This file used to list its own path, which is a trigger that can only ever fail: editing a
# workflow cannot change the manifest's version, and the registry rejects a re-publish of a
# version it already holds. Demonstrated on d4efd1d, whose only change here was the comment
# block above — `publish failed: server returned status 400 … "invalid version: cannot publish
# duplicate version"`. So the self-path is gone.
#
# That alone would leave the wider edge open: ANY `server.json` edit that does not move the
# version — a reworded description, a changed title — fails the same way. The registry is
# append-only per version, so "already published" is a correct outcome and must not be a red
# build; a workflow that is red for a correct outcome is a workflow people stop reading. The
# guard below therefore asks the registry what it already has and skips when it matches. It
# does NOT swallow a failure: an unreachable or unparseable registry fails the step, because
# "we could not ask" and "there is nothing to do" must not look the same (ADR 0002).
#
# ── It asks the by-name endpoint, retries a transient answer, and checks limits first (#1227)
#
# Three runs in a row (38993491470, 39176456274, 39187059839) went red at "already published?" with
# `curl: (22) … 504` after ~3 minutes: the registry's SEARCH endpoint timing out, while its by-name
# endpoint answered at once. The check now asks `/v0/servers/<name>/versions/<version>` (200 =
# published, 404 = not), retries a 5xx / 429 / timeout four times with backoff, and on a persistent
# failure names the status and the endpoint (`scripts/registry-has-version.sh`). The registry's own
# `description` / `title` limits are checked first (`scripts/check-server-json.mjs`, also in CI), so an
# over-long manifest fails in seconds with the field named instead of at publish.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.json"

# One publish at a time, and never cancelled halfway: a half-published registry entry is worse than a queued one.
concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.PAGS_RUNNER || '"ubuntu-24.04"') }}  # PAGS_RUNNER (#1214) names the pinned self-hosted machine when Actions minutes run out; the fallback stays pinned, see #1266
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Fails fast, before any network call, when server.json breaks the registry schema's limits —
      # naming the field, its length and the limit.
      - name: server.json fits the registry's limits
        run: node scripts/check-server-json.mjs

      # States what it measured: the name and version asked about, the endpoint, and the answer. A skip
      # that printed nothing would be indistinguishable from a query that returned nothing.
      - name: Is this version already published?
        id: check
        run: |
          set -uo pipefail
          name=$(jq -er .name server.json)
          want=$(jq -er .version server.json)
          if bash scripts/registry-has-version.sh "$name" "$want"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${name} ${want} is already in the registry — nothing to publish."
          else
            rc=$?
            [ "$rc" -eq 10 ] || exit "$rc"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.check.outputs.publish == 'true'
        run: |
          curl -fsSL --retry 4 --retry-delay 5 --retry-all-errors "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        if: steps.check.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc

      # A publish can fail transiently, or succeed and lose its answer. So after a failed attempt the
      # registry is asked whether the version is there now: if it is, that is success (a re-publish of a
      # held version is refused as a duplicate, so retrying blindly would turn success into a red run);
      # if not, it waits and tries again — 4 attempts, 5s / 15s / 30s apart.
      - name: Publish server metadata
        if: steps.check.outputs.publish == 'true'
        run: |
          set -uo pipefail
          name=$(jq -er .name server.json)
          want=$(jq -er .version server.json)
          delays=(5 15 30)
          for attempt in 1 2 3 4; do
            if ./mcp-publisher publish; then
              echo "::notice::published ${name} ${want}"
              exit 0
            fi
            if bash scripts/registry-has-version.sh "$name" "$want"; then
              echo "::notice::the publish reported a failure, but the registry now holds ${name} ${want} — published."
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "publish attempt ${attempt}/4 failed and ${want} is not in the registry; retrying in ${delays[$((attempt - 1))]}s"
              sleep "${delays[$((attempt - 1))]}"
            fi
          done
          echo "::error::mcp-publisher publish failed 4 times and the registry does not hold ${name} ${want}. Its output above has the registry's reason."
          exit 1
