name: Publish to npm
on:
  push:
    branches: [main]
    paths:
      - 'packages/sdk/**'
      - 'packages/cli/**'
      - 'packages/browser-runner/**'
      - '.github/workflows/publish-npm.yml'
      - 'scripts/release-smoke/**'
  workflow_dispatch:

# One publish at a time, and never cancelled halfway: a half-published SDK/CLI pair is worse than a queued one.
concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Release smoke test (#1152): the candidate CLI must start and heartbeat, and the previous release must be able to
  # self-update to it and come back, BEFORE anything is published. Linux and Windows only — no macOS (about ten times the
  # minute cost, and Actions minutes are already constrained). A failure here stops `publish` (it `needs` this job), so
  # neither the SDK nor the CLI goes out. Two jobs rather than a matrix so each runner image is pinned where scripts/check-workflow-runner.mjs can read it. What it does is described at the top of scripts/release-smoke/run.mjs.
  smoke-linux:
    runs-on: ubuntu-24.04  # pinned, see #1266. NOT routed to PAGS_RUNNER (#1214): the smoke test needs a clean GitHub-hosted image
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK and CLI
        run: |
          pnpm --filter @proagentstore/sdk build
          pnpm --filter @proagentstore/cli build
      - name: Release smoke test (start, heartbeat, self-update)
        run: node scripts/release-smoke/run.mjs

  smoke-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build SDK and CLI
        run: |
          pnpm --filter @proagentstore/sdk build
          pnpm --filter @proagentstore/cli build
      - name: Release smoke test (start, heartbeat, self-update)
        run: node scripts/release-smoke/run.mjs

  publish:
    needs: [smoke-linux, smoke-windows]
    runs-on: ${{ fromJSON(vars.PAGS_RUNNER || '"ubuntu-24.04"') }}  # PAGS_RUNNER (#1214) names the pinned self-hosted machine when Actions minutes run out; the fallback stays pinned, see #1266
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @proagentstore/sdk build

      - name: Check published SDK version
        id: sdk-version
        run: |
          version="$(node -p "require('./packages/sdk/package.json').version")"
          existing="$(npm view "@proagentstore/sdk@$version" version 2>/dev/null || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if [ "$existing" = "$version" ]; then
            echo "SDK version $version is already published; skipping npm publish."
          fi

      - name: Publish SDK
        if: steps.sdk-version.outputs.existing != steps.sdk-version.outputs.version
        run: cd packages/sdk && npm publish --access public

      - name: Build CLI
        run: pnpm --filter @proagentstore/cli build

      - name: Verify packed CLI in a clean install
        run: pnpm --filter @proagentstore/cli test:package

      - name: Check published CLI version
        id: cli-version
        run: |
          version="$(node -p "require('./packages/cli/package.json').version")"
          existing="$(npm view "@proagentstore/cli@$version" version 2>/dev/null || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if [ "$existing" = "$version" ]; then
            echo "CLI version $version is already published; skipping npm publish."
          fi

      - name: Publish CLI
        if: steps.cli-version.outputs.existing != steps.cli-version.outputs.version
        run: cd packages/cli && npm publish --access public
