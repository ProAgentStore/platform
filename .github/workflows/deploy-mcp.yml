name: Deploy MCP Worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/mcp/**'
      - '.github/workflows/deploy-mcp.yml'
      - 'scripts/smoke-mcp-deployment.mjs'
      - 'scripts/deploy-worker.mjs'
      - 'scripts/lib/deploy-worker.mjs'
  # Manual trigger — see ci.yml. A stuck push event must not mean an unshippable repo.
  workflow_dispatch:

concurrency:
  group: deploy-mcp
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck MCP worker
        run: pnpm --filter proagentstore-mcp typecheck

      - name: Record deployment identity
        run: echo "DEPLOY_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy MCP worker
        # Retried on Cloudflare's transient API failures only (#1046) — two MCP deploys failed on
        # "Received a malformed response from the API". Status: steps.deploy.outputs.status.
        id: deploy
        run: node scripts/deploy-worker.mjs --cwd workers/mcp -- --var "GIT_COMMIT_SHA:${{ github.sha }}" --var "DEPLOY_TIMESTAMP:${{ env.DEPLOY_TIMESTAMP }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test deployment identity
        run: node scripts/smoke-mcp-deployment.mjs
