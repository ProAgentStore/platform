name: Windows full suite
# The whole unit + integration suite (`pnpm test:full`) on a real Windows runner (#1723). cross-os.yml covers named files only.
# Manual dispatch ONLY, deliberately: never on push or pull_request, so a red run here cannot stop a deploy. Its JSON report is
# uploaded as an artifact so the failures can be triaged by root cause without re-running.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Extra vitest arguments, e.g. a path filter (workers/api) or --project integration. Empty runs everything."
        required: false
        default: ""

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-full:
    runs-on: windows-2022  # pinned, never -latest (#1266; scripts/check-workflow-runner.mjs reads this line, so no matrix)
    timeout-minutes: 300  # the whole suite is ~2.5h on a windows-2022 runner (1632 files); dispatch with `args` to split it
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The builds ci.yml runs before the suite that tests read. Host pages are not built: vitest aliases a committed stub for them.
      - name: Build SDK, console and admin
        shell: bash
        run: |
          (cd packages/sdk && npx tsc)
          (cd store/console && npx vite build)
          (cd store/admin && npx vite build)
      - name: Unit + integration tests (verdict from the JSON report, #920)
        shell: bash
        env:
          VITEST_ARGS: ${{ inputs.args }}
        # Console output is also kept as an artifact: the JSON report is only written when vitest finishes.
        run: |
          mkdir -p test-results
          pnpm test:full $VITEST_ARGS 2>&1 | tee test-results/console.log
      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-vitest-report-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
