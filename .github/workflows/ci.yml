name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: on 2026-08-07 GitHub stopped dispatching `push` for this repo and
  # two commits sat unverified and undeployed with no way to run CI. deploy-api.yml had
  # this and was the only thing recoverable.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the migration guard below: it compares each migration's DDL
          # against the commit that introduced it, and a depth-1 checkout has no such commit
          # for any file — the check would pass by verifying nothing. `--require-history`
          # makes that state a failure rather than a quiet tick, so the two must move together.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Guard agents/ Tier-0 allowlist (#49)
        run: node scripts/check-agents-allowlist.mjs
      - name: Guard quality-scan config (#290, #295)
        # The scan config only earns trust if it keeps excluding local/generated
        # artifacts and keeps INCLUDING live source. Checks the four files that all
        # walk this directory: a .vcqa.json pattern that can never match, an `agents/`
        # exclusion that would blind the scan to Tier-0 code, a biome.json that has lost
        # `!.claude` (which makes `pnpm lint` abort outright — and note the pattern is
        # NOT `!**/.claude`, which matches an agent worktree's own ancestor and excludes
        # the whole checkout from itself), a .gitleaks.toml weakened past skipping
        # worktrees into silencing findings, and a .gitignore that stopped hiding them.
        run: node scripts/check-qa-config.mjs
      - name: File-size ratchet (#302)
        # #138's refactor removed 126 lines from use-voice.ts and was fully undone
        # within hours, because nothing defended the ground it took. Pinned files may
        # not grow past their pin, and a file that SHRINKS must have its pin lowered in
        # the same commit — otherwise the lines just removed stay available as headroom,
        # which is numerically what happened. Tests are excluded on purpose.
        run: node scripts/check-file-size.mjs
      - name: Migration hygiene (#369)
        # Two files claimed 0092. Nothing broke — they happen to sort in the order someone
        # would want — but the number stopped being what decides order, and how it happened
        # (four agents landing migrations in parallel, two picking the same free number
        # minutes apart) is a race that recurs. Fails on a NEW duplicate; the historical pair
        # is recorded as an exception with the reason it may not be renamed, since wrangler
        # keys applied migrations by filename and both have already run in production.
        # Also fails when a migration's DDL changes after the commit that introduced it —
        # comments excluded, because correcting a comment that says something untrue is the
        # one edit to a shipped migration that is always right (0080, 2026-08-07).
        run: node scripts/check-migrations.mjs --require-history
      - name: Guard heavy-test isolation (#253)
        # Keeps real-browser / real-socket tests inside the `integration` project, which
        # is where they get a budget sized for real I/O instead of vitest's 5s default.
        run: node scripts/check-test-isolation.mjs
      - run: pnpm install --frozen-lockfile
      - name: Lint — packages/**, workers/** and store/** (#326)
        # `pnpm lint` has never been in CI, so every Biome rule in this repo is advisory:
        # the 300-issue count #326 is about is not a regression anyone was told about, it
        # is what "nobody is watching" looks like after a year. A gate can only be turned
        # on where the count is already zero, so this is scoped to the trees that are.
        #
        # `--error-on-warnings` on purpose. Every finding these trees ever had was a
        # warning (unused imports, a dead suppression); a gate that ignored warnings would
        # have caught none of them and would protect nothing — and store/** is the proof:
        # its last blocker was two `biome-ignore` comments that had drifted off the lines
        # they covered, reported as `suppressions/unused`, i.e. as warnings. They had been
        # suppressing NOTHING while the findings they answer went unreported, which is the
        # exact failure mode of an advisory lint (#305 cleared them).
        #
        # WIDENING THIS IS THE POINT. `workers/api` joined on 2026-08-07 — the last of its
        # 300 was a single `useOptionalChain` in routes/triggers.ts, and the `any` debt that
        # looked much larger was all 184 in *.test.ts, which this repo's tsconfig excludes,
        # so it was never typechecked either. `workers` now covers api, host and mcp, so a
        # NEW worker is in the gate from its first commit rather than accruing a backlog
        # nobody is told about.
        # One tree is still out:
        #   agents/coder   1 (a react/useExhaustiveDependencies in the web UI).
        # Add it the moment it reaches zero — do NOT widen early and then reach for
        # `continue-on-error`, which is this step with the teeth removed.
        #
        # `pnpm exec`, not `npx`: the pinned @biomejs/biome, so a new upstream rule cannot
        # turn a green main red without anyone changing this repo.
        run: pnpm exec biome check --error-on-warnings packages workers store
      - name: Docs drift (#210)
        # Documented claims vs the code that defines them: nav, MCP tool table and
        # count, removed commands, and (via scripts/openapi-coverage.mjs) the route
        # surface. Runs before the docs build so it reads the committed state.
        run: pnpm docs:drift
      - name: Install Zensical
        run: python3 -m pip install zensical==0.0.44
      - name: Build SDK
        # Emit dist (not just typecheck) — the console + agent UIs consume @proagentstore/sdk via its
        # built dist. Must run BEFORE anything that builds the console (incl. the e2e webserver).
        run: cd packages/sdk && npx tsc
      - name: Build docs
        run: pnpm docs:build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Typecheck API worker
        run: cd workers/api && npx tsc --noEmit
      - name: Typecheck coder-web
        run: cd agents/coder/web && npx tsc --noEmit
      - name: Typecheck Console
        run: cd store/console && npx tsc --noEmit
      # The admin app is only built inside deploy-host.yml, so before this a type error
      # there passed CI, landed on main, and failed at DEPLOY instead of at PR time.
      - name: Typecheck Admin
        run: cd store/admin && npx tsc --noEmit
      - name: Build Console
        run: cd store/console && npx vite build
