name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Guard agents/ Tier-0 allowlist (#49)
        run: node scripts/check-agents-allowlist.mjs
      - name: Guard heavy-test isolation (#253)
        # Keeps real-browser / real-socket tests inside the `integration` project, which
        # is where they get a budget sized for real I/O instead of vitest's 5s default.
        run: node scripts/check-test-isolation.mjs
      - run: pnpm install --frozen-lockfile
      - name: Docs drift (#210)
        # Documented claims vs the code that defines them: nav, MCP tool table and
        # count, removed commands, and (via scripts/openapi-coverage.mjs) the route
        # surface. Runs before the docs build so it reads the committed state.
        run: pnpm docs:drift
      - name: Install Zensical
        run: python3 -m pip install zensical==0.0.44
      - name: Build SDK
        # Emit dist (not just typecheck) — the console + agent UIs consume @proagentstore/sdk via its
        # built dist. Must run BEFORE anything that builds the console (incl. the e2e webserver).
        run: cd packages/sdk && npx tsc
      - name: Build docs
        run: pnpm docs:build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Typecheck API worker
        run: cd workers/api && npx tsc --noEmit
      - name: Typecheck coder-web
        run: cd agents/coder/web && npx tsc --noEmit
      - name: Typecheck Console
        run: cd store/console && npx tsc --noEmit
      # The admin app is only built inside deploy-host.yml, so before this a type error
      # there passed CI, landed on main, and failed at DEPLOY instead of at PR time.
      - name: Typecheck Admin
        run: cd store/admin && npx tsc --noEmit
      - name: Build Console
        run: cd store/console && npx vite build
