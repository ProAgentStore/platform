name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual trigger: on 2026-08-07 GitHub stopped dispatching `push` for this repo and
  # two commits sat unverified and undeployed with no way to run CI. deploy-api.yml had
  # this and was the only thing recoverable.
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, for the migration guard below: it compares each migration's DDL
          # against the commit that introduced it, and a depth-1 checkout has no such commit
          # for any file — the check would pass by verifying nothing. `--require-history`
          # makes that state a failure rather than a quiet tick, so the two must move together.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Guard agents/ Tier-0 allowlist (#49)
        run: node scripts/check-agents-allowlist.mjs
      - name: Guard quality-scan config (#290, #295)
        # The scan config only earns trust if it keeps excluding local/generated
        # artifacts and keeps INCLUDING live source. Checks the four files that all
        # walk this directory: a .vcqa.json pattern that can never match, an `agents/`
        # exclusion that would blind the scan to Tier-0 code, a biome.json that has lost
        # `!.claude` (which makes `pnpm lint` abort outright — and note the pattern is
        # NOT `!**/.claude`, which matches an agent worktree's own ancestor and excludes
        # the whole checkout from itself), a .gitleaks.toml weakened past skipping
        # worktrees into silencing findings, and a .gitignore that stopped hiding them.
        run: node scripts/check-qa-config.mjs
      - name: File-size ratchet (#302)
        # #138's refactor removed 126 lines from use-voice.ts and was fully undone
        # within hours, because nothing defended the ground it took. Pinned files may
        # not grow past their pin, and a file that SHRINKS must have its pin lowered in
        # the same commit — otherwise the lines just removed stay available as headroom,
        # which is numerically what happened. Tests are excluded on purpose.
        run: node scripts/check-file-size.mjs
      - name: Migration hygiene (#369)
        # Two files claimed 0092. Nothing broke — they happen to sort in the order someone
        # would want — but the number stopped being what decides order, and how it happened
        # (four agents landing migrations in parallel, two picking the same free number
        # minutes apart) is a race that recurs. Fails on a NEW duplicate; the historical pair
        # is recorded as an exception with the reason it may not be renamed, since wrangler
        # keys applied migrations by filename and both have already run in production.
        # Also fails when a migration's DDL changes after the commit that introduced it —
        # comments excluded, because correcting a comment that says something untrue is the
        # one edit to a shipped migration that is always right (0080, 2026-08-07).
        run: node scripts/check-migrations.mjs --require-history
      - name: Surface lock is append-only (#576)
        # #573's fingerprint proves the MCP surface was NOTICED changing, not that the
        # version moved: `SURFACE_LOCK["0.1.2"]` can be rewritten to the new hash instead of
        # `["0.1.3"]` being added, and the version stays frozen. Measured 2026-08-15 — a
        # sentence appended to SERVER_INSTRUCTIONS plus an in-place rewrite passed ALL TWELVE
        # other gates, because nothing else compares SERVER_INSTRUCTIONS to anything. That is
        # the silent surface change #573 was filed about, reachable through a green build.
        #
        # `--require-history` for the same reason the migration guard above passes it: the
        # whole check IS the history comparison, so a shallow clone must fail rather than
        # skip. fetch-depth: 0 above.
        run: node scripts/check-surface-lock.mjs --require-history
      - name: MCP parity — console capabilities are reachable or recorded (#610)
        # The console and the MCP worker are two clients of ONE API, so a capability the
        # console has is structurally available over MCP. Three projection losses were found
        # by accident in one week — #593, #592, #574 — each of them the console having
        # something MCP had dropped, and none of them findable by any gate that existed.
        #
        # This compares the two call surfaces and fails on a capability that is in neither
        # the deliberate exclusion list nor the recorded-gap ratchet. It also fails when
        # `platform-docs/mcp.md`'s published exclusion table drifts from the enforced one:
        # the doc is GENERATED from it (`--write`), because a second hand-maintained copy of
        # a list is precisely how #585 and #602 happened.
        #
        # First run: 161 console capabilities, 80 reachable, 10 excluded, 71 recorded (#613).
        # #671 closed three of them (list nodes, read and set an instance's runner-node pin):
        # 83 reachable, 68 recorded. The ratchet only ever moves this way — a new gap fails.
        run: node scripts/check-mcp-parity.mjs
      - name: Console type guard — anonymous shapes are counted or named (#616)
        # The console calls `api<{ field: type }>` in 129 places. Those inline object
        # literals cannot be compared to Worker declarations by the compiler — they need
        # a name first. `check-console-types.mjs` ratchets every anonymous shape in
        # KNOWN_ANONYMOUS; a new one that is not listed fails, and an entry whose shape
        # no longer exists in the source also fails (dead config). The denominator
        # (total / anonymous / named) prints every run so "zero gaps" is distinguishable
        # from "not measured". #617 fixed the 17 confirmed divergences (#616 AC1); this
        # guard holds the floor — unlisted divergence fails from here on.
        #
        # Count when #616 closed: 108 unique anonymous shapes across 129 call sites.
        # The only legal direction is down: name a shape, assert it in types.test.ts,
        # delete its entry.
        run: node scripts/check-console-types.mjs
      - name: Design tokens — no dead colour utility (#367)
        # Tailwind v4 has no error state. A utility naming a token `@theme` does not declare
        # generates NO rule, so the element silently keeps the colour it inherited — and a
        # bordered one keeps v4's `currentColor` default, i.e. a near-white line on a black
        # page. Nothing in this repo could see it: Biome lints JS/TS and cannot read a class
        # name, tsc sees a string, and the build succeeds. That is how 26 of them accumulated
        # across the console and the Coder UI, including a whole vocabulary from someone
        # else's design system.
        #
        # Deliberately a source scan, not an output scan: Tailwind v4 reads comments and
        # strings, so a guard reading the built stylesheet is defeated by a doc comment
        # (#368's broken rules came back from its own postmortem that way).
        run: node scripts/check-design-tokens.mjs
      - name: Guard bare catch blocks (#291)
        # Not "no empty catches" — most of this repo's swallows are RIGHT, and a gate that
        # demanded each one log something would file a second, less accurate report of an
        # event the module below already filed properly. What it demands is that the
        # decision be VISIBLE: a comment inside the braces satisfies it. Every tree is at
        # zero except packages/browser-runner, pinned at 2 because it belonged to another
        # session while #291's triage ran — gate where the tree is clean, ratchet where it
        # is not, the same rule the lint step below follows.
        run: node scripts/check-bare-catch.mjs
      - name: Typecheck coverage — every workspace project, or a recorded reason (#740)
        # The `tsc` steps at the bottom of this file are a hand-written list of directories.
        # Each was added one at a time, after a real incident, each correct — so the list
        # covered exactly the six projects that had already burned someone. Measured
        # 2026-08-23 at a8c1927: a planted `const x: number = "not a number"` in five files at
        # once — packages/cli, packages/browser-runner, packages/compliance,
        # agents/job-application-assistant and workers/host — passed EVERY gate here,
        # including the full 10,226-test vitest run, because vitest transpiles without
        # typechecking. That is 12,662 lines nothing compiled, among them the CLI + runner
        # bundle a user installs globally and runs on their own machine with their own
        # credentials, and the worker that serves proagentstore.online.
        #
        # `pnpm -r typecheck` below closes ten of the eleven. This guard is what makes that
        # countable: `pnpm -r` fails OPEN — it runs the script only where the script exists,
        # prints `Scope: 11 of 12 workspace projects`, and names the one it dropped nowhere.
        # So it also fails if the sweep is ever removed from this file.
        run: node scripts/check-typecheck-coverage.mjs
      - name: Guard heavy-test isolation (#253)
        # Keeps real-browser / real-socket tests inside the `integration` project, which
        # is where they get a budget sized for real I/O instead of vitest's 5s default.
        run: node scripts/check-test-isolation.mjs
      - run: pnpm install --frozen-lockfile
      - name: Typecheck every workspace project (#740)
        # The sweep the repo already had in `package.json` and CI never ran. It covers ten of
        # the eleven workspace projects — including packages/cli, packages/browser-runner,
        # packages/compliance and agents/job-application-assistant, which no gate compiled
        # until now. workers/host is the eleventh and is recorded as exempt with its reason in
        # scripts/check-typecheck-coverage.mjs, which runs above and fails if that exemption
        # goes stale or if this step disappears.
        #
        # It runs HERE, immediately after install, rather than beside the per-project `tsc`
        # steps at the bottom: those sit behind the Playwright matrix, and a type error in the
        # CLI should not cost a full browser run before it is reported.
        #
        # The per-project steps below STAY. Three of them compile `tsconfig.test.json`, which
        # is a different program from the project's own `typecheck` script — that is the whole
        # content of #599, and workers/api's `typecheck` excludes `*.test.ts`. Replacing the
        # list with this sweep would re-open #599 while closing #740.
        #
        # Cost measured 2026-08-23: 16.3s on a warm local checkout (8.2s reported in #740 on a
        # hotter one), against a job that already runs a full Playwright matrix.
        run: pnpm -r typecheck
      - name: Lint — packages/**, workers/** and store/** (#326)
        # `pnpm lint` has never been in CI, so every Biome rule in this repo is advisory:
        # the 300-issue count #326 is about is not a regression anyone was told about, it
        # is what "nobody is watching" looks like after a year. A gate can only be turned
        # on where the count is already zero, so this is scoped to the trees that are.
        #
        # `--error-on-warnings` on purpose. Every finding these trees ever had was a
        # warning (unused imports, a dead suppression); a gate that ignored warnings would
        # have caught none of them and would protect nothing — and store/** is the proof:
        # its last blocker was two `biome-ignore` comments that had drifted off the lines
        # they covered, reported as `suppressions/unused`, i.e. as warnings. They had been
        # suppressing NOTHING while the findings they answer went unreported, which is the
        # exact failure mode of an advisory lint (#305 cleared them).
        #
        # WIDENING THIS IS THE POINT. `workers/api` joined on 2026-08-07 — the last of its
        # 300 was a single `useOptionalChain` in routes/triggers.ts, and the `any` debt that
        # looked much larger was all 184 in *.test.ts, which this repo's tsconfig excludes,
        # so it was never typechecked either. `workers` now covers api, host and mcp, so a
        # NEW worker is in the gate from its first commit rather than accruing a backlog
        # nobody is told about.
        # agents/coder joined on 2026-08-07. Its last finding was a
        # react/useExhaustiveDependencies in use-coding-loop.ts, and the fix was to SUPPRESS
        # it with a reason, not take it: that effect is an edge detector on sessionId, and
        # `emitSystem` is a fresh closure every render, so listing it would fire the effect
        # on every render. Taking this same lint's advice in InstanceDetail.tsx is what left
        # every instance tab dead in production (#309) — a rule being right in general does
        # not make it right here.
        #
        # Every tree is now in. A NEW one must arrive at zero or arrive with its own step —
        # do NOT widen early and then reach for `continue-on-error`, which is this step with
        # the teeth removed.
        #
        # `pnpm exec`, not `npx`: the pinned @biomejs/biome, so a new upstream rule cannot
        # turn a green main red without anyone changing this repo.
        run: pnpm exec biome check --error-on-warnings packages workers store agents/coder
      - name: Docs drift (#210)
        # Documented claims vs the code that defines them: nav, MCP tool table and
        # count, removed commands, and (via scripts/openapi-coverage.mjs) the route
        # surface. Runs before the docs build so it reads the committed state.
        run: pnpm docs:drift
      - name: Install Zensical
        run: python3 -m pip install zensical==0.0.44
      - name: Build SDK
        # Emit dist (not just typecheck) — the console + agent UIs consume @proagentstore/sdk via its
        # built dist. Must run BEFORE anything that builds the console (incl. the e2e webserver).
        run: cd packages/sdk && npx tsc
      - name: Build docs
        run: pnpm docs:build
      - run: pnpm test
      - name: E2E projects still select the tests they claim to (#740)
        # `playwright.config.ts` scopes the WebKit project with `grep: /mobile — /` and
        # nothing counted what that matched. Measured 2026-08-23: neuter the regex and
        # `playwright test --list` reports `Total: 271 tests in 2 files`, exit 0, ZERO webkit
        # entries, no warning — the whole engine every phone runs can go to no coverage while
        # this job stays green. (Playwright DOES say "No tests found" when webkit runs alone;
        # with chromium in the same run, which is the real run, it does not.)
        #
        # Runs BEFORE the browser download on purpose: a selector that has stopped selecting
        # should not cost a `playwright install --with-deps` first. Listing launches no
        # browser, so it needs the npm packages and nothing else.
        run: node scripts/check-e2e-projects.mjs
      # WebKit is not a second opinion, it is the engine every phone runs. The mobile geometry
      # guards are scoped to it in playwright.config.ts (#384); without the binary here that
      # project fails to launch rather than skipping.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - name: Typecheck API worker
        run: cd workers/api && npx tsc --noEmit
      - name: Typecheck worker + SDK TESTS (#599)
        # The four `tsc` steps around this one compile SOURCE only: workers/api, workers/mcp and
        # packages/sdk each `exclude` their `*.test.ts`, and vitest transpiles without typechecking.
        # So a type-level assertion in a worker test compiled NOWHERE and could not fail — it was a
        # comment shaped like a guard. #588's `Record<RunHealth, true>` was exactly that, and ADR
        # 0002's G4 practice (break a guard, watch it go red) silently passes anything of that shape:
        # the mutation is made, nothing fails, and that is indistinguishable from "covered elsewhere".
        #
        # A SEPARATE `tsconfig.test.json` per project rather than a lifted `exclude`, because all
        # three exclusions are load-bearing and answering them is the point:
        #   • workers/*  — `types: ["@cloudflare/workers-types"]` withholds node globals from Worker
        #     code, and 86 test files import `node:fs`/`node:sqlite`. Widening the production array
        #     would hand every production module globals the Worker has no runtime for.
        #   • workers/api — `src/lib/d1-sqlite.ts` is excluded as a BUNDLE barrier: a production
        #     module importing it drags `node:fs` in and fails that typecheck, which is the point.
        #   • packages/sdk — that config EMITS the dist `files: ["dist"]` publishes to npm, so
        #     compiling tests there would ship test JS and .d.ts in the package.
        # Each test config is `noEmit`, so none of the three reasons is weakened.
        #
        # Also the only `tsc` this repo runs over workers/mcp at all — its source was never
        # typechecked by CI either, only by its own deploy workflow.
        #
        # Cost measured 2026-08-15 on a warm local checkout: 5.7s for all three (api 3.4s, mcp 1.5s,
        # sdk 0.9s) — the api project is 347 test files. Expect a small multiple of that on a CI
        # runner, against a job that already runs a full Playwright matrix.
        run: |
          cd workers/api && npx tsc -p tsconfig.test.json
          cd ../mcp && npx tsc -p tsconfig.test.json
          cd ../../packages/sdk && npx tsc -p tsconfig.test.json
      - name: Typecheck coder-web
        run: cd agents/coder/web && npx tsc --noEmit
      - name: Typecheck Console
        run: cd store/console && npx tsc --noEmit
      # The admin app is only built inside deploy-host.yml, so before this a type error
      # there passed CI, landed on main, and failed at DEPLOY instead of at PR time.
      - name: Typecheck Admin
        run: cd store/admin && npx tsc --noEmit
      - name: Build Console
        run: cd store/console && npx vite build
