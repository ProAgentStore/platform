name: Windows measure
# Diagnostics on a real Windows runner (#1726): where real-schema tests spend their time, under each SQLite durability setting.
# Manual dispatch ONLY, like windows-full-suite.yml, so it can never stop a deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  measure:
    runs-on: windows-2022  # pinned, never -latest (#1266; scripts/check-workflow-runner.mjs reads this line, so no matrix)
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FILES: workers/api/src/routes/history-retrieval.test.ts workers/api/src/lib/release-note-queue.test.ts workers/api/src/lib/runner-update-ops.test.ts workers/api/src/workflows/coding-session/workflow-run.test.ts
      FILES_FULL: workers/api/src/routes/history-retrieval.test.ts workers/api/src/lib/release-note-queue.test.ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: git config --global core.autocrlf false
      - run: pnpm install --frozen-lockfile
      - name: Runner
        shell: pwsh
        run: |
          node -e "const os=require('node:os');console.log(os.cpus().length+' cpus, '+Math.round(os.totalmem()/2**30)+' GiB, tmp '+os.tmpdir())"
          Get-PhysicalDisk | Format-Table -AutoSize | Out-String
          Get-Volume | Format-Table -AutoSize | Out-String
          Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, AntivirusEnabled, BehaviorMonitorEnabled, IoavProtectionEnabled | Format-List | Out-String
          (Get-MpPreference).ExclusionPath
      - name: Phase micro-benchmark
        run: node scripts/bench-real-schema.mjs
      # One step per setting, each allowed to fail: with fsync on, vitest reports "Timeout calling onTaskUpdate" as an unhandled error and
      # exits 1 even though every test passed, which must not stop the later settings from being measured.
      - name: "Real-schema files: synchronous OFF, journal DELETE (what main runs today)"
        continue-on-error: true
        run: |
          SECONDS=0
          PAGS_D1_SYNC=OFF PAGS_D1_JOURNAL=DELETE pnpm exec vitest run --project unit $FILES 2>&1 | tail -25
          echo "WALL off+delete: ${SECONDS}s"
      - name: "Real-schema files: synchronous OFF, journal WAL"
        continue-on-error: true
        run: |
          SECONDS=0
          PAGS_D1_SYNC=OFF PAGS_D1_JOURNAL=WAL pnpm exec vitest run --project unit $FILES 2>&1 | tail -25
          echo "WALL off+wal: ${SECONDS}s"
      - name: "Real-schema files: synchronous OFF, journal MEMORY"
        continue-on-error: true
        run: |
          SECONDS=0
          PAGS_D1_SYNC=OFF PAGS_D1_JOURNAL=MEMORY pnpm exec vitest run --project unit $FILES 2>&1 | tail -25
          echo "WALL off+memory: ${SECONDS}s"
      - name: "Real-schema files: fsync left on (FULL, journal DELETE), two files"
        continue-on-error: true
        run: |
          SECONDS=0
          PAGS_D1_SYNC=FULL PAGS_D1_JOURNAL=DELETE pnpm exec vitest run --project unit $FILES_FULL 2>&1 | tail -25
          echo "WALL full+delete: ${SECONDS}s"
      - name: "Real-schema files: fsync left on (FULL, journal WAL), two files"
        continue-on-error: true
        run: |
          SECONDS=0
          PAGS_D1_SYNC=FULL PAGS_D1_JOURNAL=WAL pnpm exec vitest run --project unit $FILES_FULL 2>&1 | tail -25
          echo "WALL full+wal: ${SECONDS}s"
      - name: Defender exclusion for temp and workspace, then the benchmark and OFF + DELETE again
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:TEMP, $env:GITHUB_WORKSPACE, $env:RUNNER_TEMP
          Add-MpPreference -ExclusionProcess node.exe
          "Exclusions: " + ((Get-MpPreference).ExclusionPath -join ", ")
          node scripts/bench-real-schema.mjs
          $env:PAGS_D1_SYNC = "OFF"; $env:PAGS_D1_JOURNAL = "DELETE"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          pnpm exec vitest run --project unit $env:FILES.Split(" ") 2>&1 | Select-Object -Last 25
          "WALL defender-excluded off+delete: $($sw.Elapsed.TotalSeconds)s"
