name: Deploy Host Worker
on:
  push:
    branches: [main]
    paths:
      - 'workers/host/**'
      - 'store/**'
      - 'platform-docs/**'
      - 'zensical.toml'
      - 'scripts/clean-generated-docs.mjs'
      - 'package.json'
      # The console bundles @proagentstore/sdk + the coder UI at build time, so
      # changes there must redeploy the console (else SDK-only fixes never go live).
      - 'packages/sdk/**'
      - 'agents/coder/web/**'
      - '.github/workflows/deploy-host.yml'
      # Same reason as deploy-api.yml: the shared build chain lives in a composite action
      # (#779), so an edit there must still trigger this deploy.
      - '.github/actions/build-platform/**'
  # Manual trigger — see ci.yml. A stuck push event must not mean an unshippable repo.
  workflow_dispatch:

concurrency:
  group: deploy-host
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The install + build chain shared with deploy-api.yml. Must come AFTER
      # pnpm/action-setup and setup-node above — the composite shells out to `pnpm`
      # directly and has no setup of its own.
      - uses: ./.github/actions/build-platform

      - name: Deploy host worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/host
          command: deploy

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://proagentstore.online/)
            if [ "$STATUS" = "200" ]; then
              echo "Host check passed"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying..."
            sleep 5
          done
          echo "Host check failed after 5 attempts"
          exit 1
